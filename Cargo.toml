[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/reef-lib", "crates/reef-daemon", "crates/reef-vcs"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/reef-vcs/reef"
homepage = "https://github.com/reef-vcs/reef"
authors = ["Reef contributors"]
rust-version = "1.97.1"

[workspace.dependencies]
# Internal
reef-lib = { path = "crates/reef-lib", version = "0.0.0" }
reef-daemon = { path = "crates/reef-daemon", version = "0.0.0" }
reef-testing = { path = "crates/reef-testing" }

# Core
jj-lib = "=0.46.0"            # R0.04 turns this on in reef-lib
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "time"] }
time = { version = "0.3", features = ["formatting", "macros"] }   # RFC 3339 timestamps for the JSON log layer (R0.09)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
pollster = "1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.10"
rand_chacha = "0.10"
tempfile = "3"
camino = "1"

# Dev and bench
criterion = { version = "0.8", features = ["html_reports"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints, with reasons. Keep this list short and justified.
module_name_repetitions = "allow"   # `workspace::WorkspaceId` is the clearer name
must_use_candidate = "allow"        # too noisy on plain getters
missing_errors_doc = "allow"        # error enums are documented at the type, not every fn
missing_panics_doc = "allow"        # panics are bugs; documenting them legitimizes them
# Lints we turn up beyond pedantic.
unwrap_used = "warn"                # clippy.toml allows it in tests
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"               # binaries opt out per-module with a comment
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
debug = 1          # keep symbols for profiling benches
