[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [
    "crates/reef-error",
    "crates/reef-lib",
    "crates/reef-api",
    "crates/reef-client",
    "crates/reef-broker",
    "crates/reef-symbols",
    "crates/reef-daemon",
    "crates/reef-vcs",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/reef-vcs/reef"
homepage = "https://github.com/reef-vcs/reef"
authors = ["Reef contributors"]
rust-version = "1.97.1"

[workspace.dependencies]
# Internal
reef-error = { path = "crates/reef-error", version = "0.2.0" }
reef-lib = { path = "crates/reef-lib", version = "0.2.0" }
reef-api = { path = "crates/reef-api", version = "0.2.0" }
reef-client = { path = "crates/reef-client", version = "0.2.0" }
reef-broker = { path = "crates/reef-broker", version = "0.2.0" }
reef-symbols = { path = "crates/reef-symbols", version = "0.2.0" }
reef-daemon = { path = "crates/reef-daemon", version = "0.2.0" }
reef-testing = { path = "crates/reef-testing", version = "0.2.0" }   # unpublished; see reef-daemon's `testing` feature

# Core
jj-lib = "=0.46.0"
# Only to name gix::hash::Kind when creating repositories (`Repo::init_internal_git` and test
# fixtures); jj-lib does not re-export gix. Must match the gix version jj-lib depends on exactly.
gix = { version = "=0.88.0", default-features = false }
# Decodes jj-lib's own protobuf messages (`tree_state`, R1.02; jj-lib does not re-export prost)
# and the daemon API's generated code (R1.03). Same major as jj-lib's and tonic-prost's.
prost = "0.14"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "time"] }
time = { version = "0.3", features = ["formatting", "macros"] }   # RFC 3339 timestamps for the JSON log layer (R0.09)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "net", "signal", "process"] }
pollster = "1"
# Revset date patterns (R2.02): jj-lib's `DatePatternContext` is built from a chrono time. The
# version and features jj-lib already uses, so the lockfile gains nothing.
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock"] }
# Unified diff hunks (R2.02): jj-lib's `unified_diff_hunks` takes `BStr` sides. The version
# jj-lib already uses.
bstr = "1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.10"
rand_chacha = "0.10"
tempfile = "3"
camino = "1"
# Daemon metadata (ADR 0003): bundled so every platform runs the same SQLite; `backup` for R1.18.
rusqlite = { version = "0.41", features = ["bundled", "backup", "collation"] }
# Materialization backends (R1.02): stat-only walks for disk usage, and statfs/statvfs for the
# backend probe. Later backend tickets add nix features (mount, signal, process).
walkdir = "2"
nix = { version = "0.31", features = ["fs"] }
# Shared dependency stores (R1.20): the lockfile hash a store is keyed by. A verification digest,
# not an object identity (ADR 0011, ADR 0022).
blake3 = "1.8"
# The APFS clone backend (R1.08): `clonefile(2)` on a whole directory through `libc`, and per-file
# clones through `reflink-copy` (`clonefile` on macOS, `FICLONE` on Linux for R1.10).
libc = "0.2"
reflink-copy = "0.1"
# The backend conformance suite's tree digest (R1.11, dev-only). 0.11, the version jj-lib's
# dependencies already pull in, rather than the brief's 0.10, so the lockfile gains no second copy.
sha2 = "0.11"
# The daemon's gRPC API over a Unix socket (R1.03, ADR 0012). `tonic-prost-build` is fed a
# descriptor set compiled by `protox`, so neither CI nor contributors need `protoc`.
tonic = "0.14"
tonic-prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
protox = "0.10"
# The API schema (R2.01): each method's `(reef.api.v1.access)` option, read in reef-api's build
# script, and google.rpc.Status for the error envelope. Same versions tonic and protox pull in.
prost-reflect = "0.16"
tonic-types = "0.14"
# Page tokens (R2.01): opaque base64url strings.
base64 = "0.22"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"                 # CancellationToken for shutdown
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
tracing-appender = "0.2"           # the daily-rotated daemon log file
etcetera = "0.11"                  # platform state directories
# `config.toml` (R1.04, ADR 0013): durations in humantime's form (`"30m"`).
toml = "1"
humantime-serde = "1"
# Filesystem notifications that trigger snapshots (R1.13). One debounced watcher per daemon; 9.0
# and 0.8 are release candidates.
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
# jj-lib's scan runs on rayon's current pool; the daemon gives each scan slot its own (R1.13).
# Same major as jj-lib's.
rayon = "1"
# Watchman (R1.14), behind the `watchman` features: the version jj-lib's own `watchman` feature
# uses, so the daemon's trigger subscriptions and jj's narrowed scans share one client crate.
watchman_client = "0.9"
# The CLI (R1.22): shell completions from the same clap `Command`, and duration flags in the
# form config.toml uses.
clap_complete = "4"
humantime = "2"
# The MCP server (R2.13, ADR 0035): `reef mcp` over stdio. Exact, as for jj-lib: it releases
# weekly at 3.x and its model types change across minors. No macros: the server's tool table is
# by hand, which keeps rmcp-macros and darling out of `reef`.
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1"                     # the tools' input schemas, the version rmcp uses
# `.mcp.json` (R2.13): Reef's entry merged without reordering the rest. Not serde_json's
# `preserve_order`, which features unify across the build and would reorder `config show --json`.
indexmap = { version = "2", features = ["serde"] }

# The symbol index (R2.14, ADR 0042): tree-sitter tags extracted in the daemon. No `wasm`
# (wasmtime) and no `bindgen`; grammar crates depend only on `tree-sitter-language`, so they are
# not pinned to the core's version. `streaming-iterator` is what `QueryCursor::matches` returns.
tree-sitter = { version = "0.27", default-features = false, features = ["std"] }
streaming-iterator = "0.1"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"    # TypeScript and TSX; JavaScript goes through TSX
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
# SCIP's vendored schema (R2.14), compiled with protox like the API's. The version tonic-prost-build
# already pulls in.
prost-build = "0.14"

# Dev and bench
criterion = { version = "0.8", features = ["html_reports"] }
assert_cmd = "2"                   # CLI tests (R1.22)

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints, with reasons. Keep this list short and justified.
module_name_repetitions = "allow"   # `workspace::WorkspaceId` is the clearer name
must_use_candidate = "allow"        # too noisy on plain getters
missing_errors_doc = "allow"        # error enums are documented at the type, not every fn
missing_panics_doc = "allow"        # panics are bugs; documenting them legitimizes them
# Lints we turn up beyond pedantic.
unwrap_used = "warn"                # clippy.toml allows it in tests
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"               # binaries opt out per-module with a comment
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
debug = 1          # keep symbols for profiling benches

# Release binaries (R1.28, `.github/workflows/release.yml`): smaller and a little faster than
# `release`, which keeps its symbols and build times for benches.
[profile.dist]
inherits = "release"
debug = 0
strip = true
lto = "thin"
codegen-units = 1

# Generating synthetic trees dominates test time in debug builds (46 s for the large preset
# unoptimized, about 10 s optimized), so the generator and its RNG are optimized even in dev.
[profile.dev.package.reef-testing]
opt-level = 3
[profile.dev.package.rand_chacha]
opt-level = 3
[profile.dev.package.ppv-lite86]
opt-level = 3
