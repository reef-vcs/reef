[package]
name = "reef-broker"
description = "Reef broker: bounded in-memory rings between a log and the streams that follow it, read once and fanned out. Reef is version control for fleets of coding agents."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "broker"]
categories = ["development-tools", "concurrency"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
bench = false

# No Reef crate, no jj-lib, no gRPC: the daemon (R2.22) and the store (phase four) each bring their
# own producer and reader, and `reef-testing`'s crate_graph test keeps it that way (ADR 0038).
[dependencies]
tokio.workspace = true           # watch channels and Instant

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }   # paused clocks for linger
criterion.workspace = true

[[bench]]
name = "broker"
harness = false
