// Shared dependency stores (R1.20, ADR 0022): built once per store name and
// lockfile hash by the daemon, sealed read-only, and mounted into every
// workspace whose lockfile hashes the same. Stores are per daemon; `repo`
// names the repository whose `reef.toml` declares the store.
syntax = "proto3";

package reef.daemon.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "reef/daemon/v1/types.proto";

// Shared dependency stores: built once, sealed, mounted everywhere.
service Stores {
  // Runs the store's `build` command in the daemon and seals what it wrote.
  //
  // In a scratch workspace: the command's output lines as they come, then
  // the result. A build that exits non-zero ends with a result whose `sealed` is false.
  // A sealed store for the lockfile's hash is the result at once, unless
  // `force`. Errors: NOT_FOUND (no such store at the revision),
  // ALREADY_EXISTS (a build of the same store and hash is running),
  // INTERNAL (timed out; the process group was killed), UNAVAILABLE (the
  // daemon is shutting down).
  rpc Build(BuildStoreRequest) returns (stream BuildEvent);
  // Starts a build the client runs itself (R2.27): leases a scratch
  // workspace on `rev` with the other stores mounted, and returns where to
  // run the store's command and where its output goes. Seal or Abort ends
  // it; an expired lease aborts it.
  rpc Prepare(PrepareStoreBuildRequest) returns (PrepareStoreBuildResponse); // R2.27
  // Seals what a prepared build wrote, given the command's exit code
  // (R2.27): a zero exit seals the store read-only; any other keeps it for
  // inspection until GC, like a failed Build.
  rpc Seal(SealStoreBuildRequest) returns (BuildResult); // R2.27
  // Abandons a prepared build and releases its scratch workspace (R2.27).
  rpc Abort(AbortStoreBuildRequest) returns (AbortStoreBuildResponse); // R2.27
  // Sealed stores.
  rpc List(ListStoresRequest) returns (ListStoresResponse);
}

// Which store to build, and how.
message BuildStoreRequest {
  // A repo id, a unique id prefix, or an absolute path inside a registered
  // root.
  string repo = 1;
  // The `[[store]] name`.
  string name = 2;
  // The revision whose `reef.toml` and lockfile to build from; empty for
  // CreateRequest's default start (`main`, origin's HEAD, `master`, ...).
  string rev = 3;
  // How long the command may run; unset for 30 minutes.
  google.protobuf.Duration timeout = 4;
  // Rebuild even if a sealed store exists; the old one is moved aside when
  // the new one is sealed.
  bool force = 5;
}

// One event of a build's stream.
message BuildEvent {
  // Exactly one is set.
  oneof event {
    // A line the command wrote.
    OutputLine line = 1;
    // The build's result: the stream's last message.
    BuildResult done = 2;
    // Sent once, before the first line, when the command is about to run
    // (RX.01): what the daemon runs, for the client to show.
    BuildStarted started = 3;
  }
}

// The command a build runs, as `reef.toml` at `rev` declares it.
message BuildStarted {
  // The `[[store]] build` argv.
  repeated string argv = 1;
  // `[store.env]`, as `KEY=VALUE`, sorted by key. Values are shown to the
  // client: they are repository content, committed in `reef.toml`.
  repeated string env = 2;
  // The commit the build runs on, full hex.
  string rev = 3;
}

// One line of the build command's output, without its line ending, lossily
// decoded as UTF-8.
message OutputLine {
  // Which of the command's streams it came from.
  enum Stream {
    // Not set; the daemon never sends it.
    STREAM_UNSPECIFIED = 0;
    // Standard output.
    STDOUT = 1;
    // Standard error.
    STDERR = 2;
  }
  // The line.
  string text = 1;
  // Where it came from.
  Stream stream = 2;
}

// How a build ended.
message BuildResult {
  // The store's name.
  string name = 1;
  // blake3 of the lockfile's bytes, 64 hex characters.
  string lockfile_hash = 2;
  // The sealed store's directory; a failed build's directory, kept for
  // inspection until GC.
  string path = 3;
  // Bytes the sealed store allocates.
  uint64 bytes = 4;
  // Whether the store is sealed; false for a failed build.
  bool sealed = 5;
  // The command's exit code; -1 if a signal ended it.
  int32 exit_code = 6;
  // The operation that released the scratch workspace; empty when nothing
  // was built.
  string op_id = 7;
  // Output lines dropped because the client read too slowly.
  uint64 dropped_lines = 8;
  // A sealed store already existed; nothing was built.
  bool already_built = 9;
  // The event sequence of the scratch workspace's release (R2.09); 0
  // until then, and when nothing was built.
  uint64 seq = 10;
}

// Which stores to list.
message ListStoresRequest {
  // Empty for every store; otherwise the stores this repository built
  // first or one of its workspaces mounts.
  string repo = 1;
}

// A built store.
message StoreInfo {
  // The `[[store]] name`.
  string name = 1;
  // blake3 of its lockfile, 64 hex characters.
  string lockfile_hash = 2;
  // Its directory.
  string path = 3;
  // Allocated bytes, measured when listed.
  uint64 bytes = 4;
  // When its build was sealed.
  google.protobuf.Timestamp built_at = 5;
  // Whether it is sealed.
  bool sealed = 6;
  // Loaded workspaces that mount it, a running build's scratch workspace
  // (which mounts the other stores it can) included.
  uint32 in_use_by = 7;
  // The repository that built it first.
  string repo_id = 8;
}

// The stores.
message ListStoresResponse {
  // One per store and lockfile hash.
  repeated StoreInfo stores = 1;
}

// A build to prepare (R2.27).
message PrepareStoreBuildRequest {
  // A repo id, a unique id prefix, or an absolute path inside a registered
  // root.
  string repo = 1;
  // The `[[store]] name`.
  string name = 2;
  // The revision whose `reef.toml` and lockfile to build from; empty for
  // CreateRequest's default start.
  string rev = 3;
  // The scratch workspace's lease length; 0 = the daemon default.
  uint64 lease_ms = 4;
  // Prepare even if a sealed store exists for the lockfile's hash.
  bool force = 5;
  // Who builds: the scratch workspace's owner; Seal and Abort must name
  // the same.
  string owner = 6;
}

// Where and what to build (R2.27). Run `argv` in `scratch_root` with the
// client's environment, then `env`, then `REEF_STORE_DIR = store_dir`,
// `REEF_STORE_NAME = name`, and `REEF_WORKSPACE`, `REEF_WORKSPACE_PATH`,
// `REEF_REPO`, `REEF_SOCKET` for `workspace`; heartbeat `lease`; then Seal
// with the exit code.
message PrepareStoreBuildResponse {
  // Names the build in Seal and Abort.
  string build_id = 1;
  // The scratch workspace's directory: the command's working directory.
  string scratch_root = 2;
  // Where the command writes the store's contents.
  string store_dir = 3;
  // The `[[store]] build` argv.
  repeated string argv = 4;
  // `[store.env]`, as `KEY=VALUE`, sorted by key.
  repeated string env = 5;
  // The commit the build runs on, full hex.
  string rev = 6;
  // blake3 of the lockfile's bytes, 64 hex characters.
  string lockfile_hash = 7;
  // The scratch workspace's lease; the build aborts when it expires.
  Lease lease = 8;
  // A sealed store already exists and `force` was not set: nothing was
  // prepared, and `result` describes the store.
  bool already_built = 9;
  // The existing store, when `already_built`.
  BuildResult result = 10;
  // The scratch workspace.
  Workspace workspace = 11;
  // Where the store is mounted, repository-root relative.
  string mount = 12;
  // The store's `[[store]] name`.
  string name = 13;
}

// A prepared build to seal (R2.27).
message SealStoreBuildRequest {
  // From PrepareStoreBuildResponse.
  string build_id = 1;
  // The command's exit code; -1 if a signal ended it.
  int32 exit_code = 2;
  // The owner Prepare named; another is PERMISSION_DENIED.
  string owner = 3;
}

// A prepared build to abandon (R2.27).
message AbortStoreBuildRequest {
  // From PrepareStoreBuildResponse.
  string build_id = 1;
  // Why, for the log; free text.
  string reason = 2;
  // The owner Prepare named; another is PERMISSION_DENIED.
  string owner = 3;
}

// What the abort did (R2.27).
message AbortStoreBuildResponse {
  // The operation that released the scratch workspace.
  string op_id = 1;
  // Bytes the discarded build had allocated.
  uint64 freed_bytes = 2;
  // The release's event sequence (R2.09); 0 until then.
  uint64 seq = 3;
}
