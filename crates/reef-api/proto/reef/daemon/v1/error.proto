// The detail every daemon error carries (R1.05, ADR 0017, ADR 0029): the
// status details are a `google.rpc.Status` whose `details` hold one
// `ErrorDetail` as a `google.protobuf.Any`
// (`type.googleapis.com/reef.daemon.v1.ErrorDetail`), the standard
// rich-error model, so any gRPC client library can decode it.
syntax = "proto3";

package reef.daemon.v1;

// What went wrong, in terms a client can act on.
message ErrorDetail {
  // The error's `ErrorKind`, by variant name: NotFound, AlreadyExists,
  // InvalidArgument, Conflict, Unavailable, PermissionDenied, Io, or
  // Internal. A status without an ErrorDetail (from the transport or a
  // limit) maps back through its gRPC code. Exit codes and retries key on this, not on the gRPC code (Io
  // and Internal share INTERNAL).
  string kind = 1;
  // The error's message, then each source's, outermost first.
  repeated string chain = 2;
  // How to fix it, in one sentence, when the daemon knows (R1.26, ADR
  // 0025); empty otherwise.
  string hint = 3;
  // A command line that fixes it or shows what to do next, as an argv an
  // agent can run verbatim (`["reef", "store", "build", "deps", ...]`);
  // empty when there is none. Never a placeholder: the daemon fills in the
  // ids it knows.
  repeated string next = 4;
}
