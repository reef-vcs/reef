// The detail a 0.1 daemon's errors carry in their status details, raw: frozen
// at 0.1.0; used only to tell a 0.1 client that it must upgrade (R2.01, ADR
// 0029). Never edited.
syntax = "proto3";

package reef.daemon.v0;

message ErrorDetail {
  // The error's `reef_lib::error::ErrorKind`, by variant name: NotFound,
  // AlreadyExists, InvalidArgument, Conflict, Unavailable,
  // PermissionDenied, Io, or Internal.
  string kind = 1;
  // The error's message, then each source's, outermost first.
  repeated string chain = 2;
  // How to fix it, in one sentence, when the daemon knows (R1.26, ADR
  // 0025); empty otherwise.
  string hint = 3;
  // A command line that fixes it or shows what to do next, as an argv an
  // agent can run verbatim (`["reef", "store", "build", "deps", ...]`);
  // empty when there is none. Never a placeholder: the daemon fills in the
  // ids it knows.
  repeated string next = 4;
}
