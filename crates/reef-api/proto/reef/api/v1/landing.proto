// Landing proposed changes onto a local bookmark (R3.13, ADR 0064;
// `docs/landing.md`).
//
// A landing is one attempt to put a queued change onto its destination, a
// local bookmark, in one jj operation. The change must be PROPOSED at the
// commit its proposal recorded. The gate judges that commit with the
// policy at the destination's head (R3.07) and refuses anything but ALLOW;
// a change it passes is QUEUED, and the repository's landing worker lands
// it: a fast-forward when the destination's head is its only parent, else
// a rebase onto the head that must merge with no conflict, judged again,
// then one operation that moves the bookmark and records the LANDED
// transition. A landing that does not finish returns the change to
// PROPOSED with a reason. Every attempt is a record that keeps its
// evaluation, and the evidence a landed change's rules used is kept for
// good.
//
// Every landing runs in a batch (R3.14, ADR 0067): queued changes for one
// destination, rebased one on another onto its head. Under the
// destination policy's `[landing] checks = "batch"` (the default), each
// change's `[[require]]` rules are judged again on the batch's tested
// tree, whose evidence counts for every change at or below it; the
// executor is asked only for the pairs missing there, on a trial commit
// carrying that tree. A failing tree is bisected over the batch's
// prefixes: the passing prefix lands, the first failing change returns to
// PROPOSED with reason CHECKS, and the rest stay queued.
syntax = "proto3";

package reef.api.v1;

import "google/protobuf/timestamp.proto";
import "reef/api/v1/changes.proto";
import "reef/api/v1/lifecycle.proto";
import "reef/api/v1/operations.proto";
import "reef/api/v1/options.proto";
import "reef/api/v1/policy.proto";
import "reef/api/v1/remote.proto";

// Landing changes and reading landings.
service LandingService {
  // Lands a proposed change: judges it at the gate, queues it, and waits up
  // to `wait_ms` for the landing to finish. A change the gate refuses is a
  // landing with outcome BLOCKED, not an error, and stays PROPOSED; one
  // already QUEUED returns its open landing. Through the remote listener,
  // any write token may ask: proposing a change is the request to land it,
  // and policy decides.
  //
  // Errors: the revision reasons of ChangeService for `revision`;
  // EXPECTED_COMMIT_MISMATCH; FAILED_PRECONDITION with reason NOT_PROPOSED
  // (metadata `change_id`, `state`), PROPOSAL_AMENDED (metadata
  // `change_id`, `commit_id`, `visible_commit_id`), DESTINATION_NOT_LOCAL,
  // DESTINATION_NOT_FOUND or DESTINATION_CONFLICTED (metadata
  // `destination`); UNAVAILABLE with reason QUEUE_FULL (metadata
  // `max`); INVALID_ARGUMENT with reason INVALID_WAIT (metadata `max`); a
  // failed snapshot's own error, with reason SNAPSHOT_FAILED (metadata
  // `workspace_id`).
  rpc LandChange(LandChangeRequest) returns (LandChangeResponse) {
    option (reef.api.v1.access) = ACCESS_WRITE;
  }

  // One landing, by id or as a change's latest, with every change's whole
  // evaluation.
  //
  // Errors: NOT_FOUND with reason LANDING_NOT_FOUND (metadata `id` or
  // `change_id`); INVALID_ARGUMENT when both or neither of `id` and
  // `change` are set; the repository reasons.
  rpc GetLanding(GetLandingRequest) returns (GetLandingResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A repository's landings, newest first, filtered and paged. Each
  // change's evaluation carries only its decision and source; GetLanding
  // returns it whole.
  //
  // Errors: INVALID_PAGE_TOKEN; a negative `page_size` is INVALID_ARGUMENT;
  // the repository reasons.
  rpc ListLandings(ListLandingsRequest) returns (ListLandingsResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // One batch (R3.14), by id or as a change's latest, with its members and
  // trials.
  //
  // Errors: NOT_FOUND with reason BATCH_NOT_FOUND (metadata `id` or
  // `change_id`); INVALID_ARGUMENT when both or neither of `id` and
  // `change` are set; the repository reasons.
  rpc GetBatch(GetBatchRequest) returns (GetBatchResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A repository's batches, newest first, filtered and paged.
  //
  // Errors: INVALID_PAGE_TOKEN; a negative `page_size` is INVALID_ARGUMENT;
  // the repository reasons.
  rpc ListBatches(ListBatchesRequest) returns (ListBatchesResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// How a landing ended, or that it has not yet.
enum LandingOutcome {
  // Not set; in a filter, any.
  LANDING_OUTCOME_UNSPECIFIED = 0;
  // The gate refused it: the change was never queued and stays PROPOSED.
  LANDING_OUTCOME_BLOCKED = 1;
  // The change is queued and the landing has not finished.
  LANDING_OUTCOME_QUEUED = 2;
  // The destination moved to the landed commit.
  LANDING_OUTCOME_LANDED = 3;
  // Queued, then returned to PROPOSED with a reason.
  LANDING_OUTCOME_DEQUEUED = 4;
  // A client withdrew, declined or superseded the change while it was
  // queued, or it was seen landed some other way.
  LANDING_OUTCOME_CANCELLED = 5;
}

// Why a landing was blocked or dequeued.
enum LandingReason {
  // None: it landed, is queued, or was cancelled.
  LANDING_REASON_UNSPECIFIED = 0;
  // The policy's decision was not ALLOW; the change's evaluation says why.
  LANDING_REASON_POLICY = 1;
  // Rebasing onto the destination conflicts; `conflicts` lists the paths.
  LANDING_REASON_CONFLICTED = 2;
  // A parent of the change is not on the destination.
  LANDING_REASON_UNLANDED_PARENTS = 3;
  // The change's visible commit is no longer the queued one.
  LANDING_REASON_AMENDED = 4;
  // The destination bookmark is gone, conflicted, or not local.
  LANDING_REASON_DESTINATION = 5;
  // The destination moved under the landing three times in a row.
  LANDING_REASON_BUSY = 6;
  // An internal error; `message` says what.
  LANDING_REASON_FAILED = 7;
  // The change was found to fail required checks on its batch's tested
  // tree (R3.14): the tree with it failed where the tree before it passed.
  // `tested_evaluation` names the failed evidence.
  LANDING_REASON_CHECKS = 8;
  // No verdict could be had on the batch's tested tree: the executor jobs
  // asked for its missing evidence ended without one, or nobody claimed
  // them (R3.14). Not the change's fault; `message` names the jobs.
  LANDING_REASON_UNAVAILABLE = 9;
}

// One change of a landing.
message LandedChange {
  // The change, in hex.
  string change_id = 1;
  // The commit it was queued at: the one judged.
  string queued_commit_id = 2;
  // That commit's tree.
  string queued_tree_id = 3;
  // The commit now on the destination; empty unless it landed.
  string landed_commit_id = 4;
  // Its tree.
  string landed_tree_id = 5;
  // Whether it was rebased onto the destination; false for a fast-forward.
  bool rebased = 6;
  // Paths both the change and the destination changed since the change's
  // parents, at most 100.
  repeated string overlap = 7;
  // How many there are.
  uint32 overlap_total = 8;
  // For a CONFLICTED landing, the conflicted paths, at most 100.
  repeated string conflicts = 9;
  // How many there are.
  uint32 conflicts_total = 10;
  // The evaluation, with its source; unset when the landing stopped before
  // judging. ListLandings sends only its decision and source.
  PolicyEvaluation evaluation = 11;
  // The evidence a landed change's satisfied rules used, kept for good and
  // linked to the change.
  repeated string pinned_evidence_ids = 12;
  // The tree whose evidence its `[[require]]` rules were judged on in its
  // batch (R3.14); empty when none was (`checks = "proposal"`).
  string tested_tree_id = 13;
  // The trial commit carrying that tree; empty when none was written.
  string tested_commit_id = 14;
  // The evaluation over the tested tree's evidence, of which only the
  // `[[require]]` rules count; unset when there was none. ListLandings
  // sends only its decision and source.
  PolicyEvaluation tested_evaluation = 15;
  // Its position in the batch, from 1; 0 when it was never in one.
  uint32 batch_position = 16;
}

// One attempt to land.
message Landing {
  // `lnd_` and 16 hex digits.
  string id = 1;
  // The repository.
  string repo_id = 2;
  // The destination bookmark.
  string destination = 3;
  // Its head when the landing read it.
  string destination_before = 4;
  // Its head after a landing; empty otherwise.
  string destination_after = 5;
  // How it ended.
  LandingOutcome outcome = 6;
  // Why, for BLOCKED and DEQUEUED.
  LandingReason reason = 7;
  // More about the reason; untrusted text for a policy's messages.
  string message = 8;
  // The changes, in landing order: one per landing until stacks (R3.10).
  // A batch lands several landings in one operation.
  repeated LandedChange changes = 9;
  // How many identical requests a BLOCKED landing stands for.
  uint32 attempts = 10;
  // The operation that queued the change; empty for BLOCKED.
  string enqueue_operation_id = 11;
  // The operation that landed or returned it; empty otherwise.
  string operation_id = 12;
  // Whether GC dropped `operation_id`'s operation, past its window.
  bool operation_collected = 13;
  // The `reef-agent` that asked.
  string agent = 14;
  // Who asked, as declared.
  TransitionActor actor = 15;
  // The identity that asked: the named workspace's session identity, else
  // the daemon's default person identity.
  string identity = 16;
  // The remote token that asked, if the call came through the remote
  // listener.
  RemoteCaller remote = 17;
  // When it was asked for.
  google.protobuf.Timestamp created_at = 18;
  // When it finished; unset while QUEUED.
  google.protobuf.Timestamp finished_at = 19;
  // The batch it is, or was last, in (R3.14); empty when none.
  string batch_id = 20;
}

// Where a batch is (R3.14).
enum BatchState {
  // Not set; in a filter, any.
  BATCH_STATE_UNSPECIFIED = 0;
  // Its head tree's checks are requested or running.
  BATCH_STATE_TESTING = 1;
  // Its head failed; a smaller prefix is being tested.
  BATCH_STATE_BISECTING = 2;
  // It ended; `outcome` says how.
  BATCH_STATE_FINISHED = 3;
}

// How a batch ended (R3.14).
enum BatchOutcome {
  // Not finished.
  BATCH_OUTCOME_UNSPECIFIED = 0;
  // Every member landed.
  BATCH_OUTCOME_LANDED = 1;
  // A prefix landed (possibly none), the culprit returned to PROPOSED with
  // reason CHECKS, and the members after it stayed queued.
  BATCH_OUTCOME_SPLIT = 2;
  // No verdict could be had; the tested members returned to PROPOSED with
  // reason UNAVAILABLE.
  BATCH_OUTCOME_UNAVAILABLE = 3;
  // The destination moved or a member left; the members still queued form
  // the next batch.
  BATCH_OUTCOME_REFORMED = 4;
  // The daemon stopped; the next batch forms from the queue.
  BATCH_OUTCOME_INTERRUPTED = 5;
  // The destination moved under three batches in a row; the members
  // returned to PROPOSED with reason BUSY.
  BATCH_OUTCOME_BUSY = 6;
}

// What became of one member of a batch (R3.14).
enum BatchMemberResult {
  // Not decided yet.
  BATCH_MEMBER_RESULT_UNSPECIFIED = 0;
  // It landed.
  BATCH_MEMBER_RESULT_LANDED = 1;
  // It was the first failing change; returned with reason CHECKS.
  BATCH_MEMBER_RESULT_CULPRIT = 2;
  // It stayed queued for the next batch.
  BATCH_MEMBER_RESULT_REQUEUED = 3;
  // It returned to PROPOSED for another reason (its landing says which).
  BATCH_MEMBER_RESULT_DEQUEUED = 4;
  // It left the queue: withdrawn, declined, superseded or landed by hand.
  BATCH_MEMBER_RESULT_LEFT = 5;
  // It returned to PROPOSED with reason UNAVAILABLE.
  BATCH_MEMBER_RESULT_UNAVAILABLE = 6;
}

// How a trial ended (R3.14).
enum TrialResult {
  // Not finished.
  TRIAL_RESULT_UNSPECIFIED = 0;
  // Every included member's required evidence passed on the tree.
  TRIAL_RESULT_PASSED = 1;
  // Some required evidence's newest trusted verdict on the tree is a fail.
  TRIAL_RESULT_FAILED = 2;
  // The jobs ended with evidence still missing.
  TRIAL_RESULT_UNAVAILABLE = 3;
  // The batch re-formed or ended first.
  TRIAL_RESULT_CANCELLED = 4;
}

// One member of a batch.
message BatchMember {
  // Its position in the chain, from 1.
  uint32 position = 1;
  // Its landing.
  string landing_id = 2;
  // The change, in hex.
  string change_id = 3;
  // The commit it was queued at.
  string queued_commit_id = 4;
  // The chain's tree with it applied: the destination and every member up
  // to it.
  string planned_tree_id = 5;
  // What became of it.
  BatchMemberResult result = 6;
}

// One tested prefix of a batch.
message BatchTrial {
  // How many members the tested tree has, from the first.
  uint32 prefix = 1;
  // The tested tree.
  string tree_id = 2;
  // The trial commit carrying it; empty when no executor run was needed.
  string commit_id = 3;
  // The operation that wrote the trial commit.
  string operation_id = 4;
  // How it ended; unset while open.
  TrialResult result = 5;
  // The executor jobs asked for the tree's missing evidence.
  repeated string job_ids = 6;
  // For a FAILED trial, the needs whose newest verdict is a fail; for an
  // UNAVAILABLE one, those still missing. At most 20.
  repeated PolicyEvidenceNeed needs = 7;
  // How many there are.
  uint32 needs_total = 8;
  // How many times its jobs were asked for.
  uint32 attempts = 9;
  // When it started.
  google.protobuf.Timestamp created_at = 10;
  // When it ended; unset while open.
  google.protobuf.Timestamp finished_at = 11;
}

// One attempt to land several queued changes together (R3.14).
message LandingBatch {
  // `bat_` and 16 hex digits.
  string id = 1;
  // The repository.
  string repo_id = 2;
  // The destination bookmark.
  string destination = 3;
  // Its head when the batch formed: the chain's base.
  string base_commit_id = 4;
  // Where it is.
  BatchState state = 5;
  // How it ended.
  BatchOutcome outcome = 6;
  // The members, in chain order.
  repeated BatchMember members = 7;
  // The tested prefixes, in the order they were tested.
  repeated BatchTrial trials = 8;
  // The culprit's position, for SPLIT; 0 otherwise.
  uint32 culprit_position = 9;
  // How many members landed.
  uint32 landed_count = 10;
  // The destination policy's `[landing] checks`: `batch` or `proposal`.
  string checks = 11;
  // The commit whose policy formed the batch.
  string policy_commit_id = 12;
  // The operation that landed members; empty when none landed.
  string operation_id = 13;
  // Whether GC dropped `operation_id`'s operation, past its window.
  bool operation_collected = 14;
  // More about how it ended.
  string message = 15;
  // When it formed.
  google.protobuf.Timestamp created_at = 16;
  // When it finished; unset while open.
  google.protobuf.Timestamp finished_at = 17;
}

// The change to land.
message LandChangeRequest {
  // The repository, by id or path; empty for the workspace's.
  string repo = 1;
  // A workspace id, for `@`.
  string workspace = 2;
  // The revision naming the change; required. `@` needs `workspace`.
  string revision = 3;
  // The commit the caller expects `revision` to name; empty for no check.
  string expected_commit_id = 4;
  // How long to wait for the landing to finish, at most 600,000; 0 returns
  // once it is queued (or refused).
  uint32 wait_ms = 5;
  // Who asks: HUMAN or AGENT; unspecified is AGENT when the call carries an
  // agent name, else HUMAN. Through the remote listener it is AGENT.
  TransitionActor actor = 6;
  // Skip the snapshot of `workspace` a revision using `@` takes first.
  bool skip_snapshot = 7;
}

// What LandChange did.
message LandChangeResponse {
  // The landing as it was when the wait ended.
  Landing landing = 1;
  // The operation that queued the change; unset for BLOCKED, or when the
  // change was already queued.
  Operation enqueue = 2;
  // The operation that landed or returned it, if it finished in time.
  Operation operation = 3;
  // The snapshot of `workspace` taken first, if it recorded an operation.
  Operation snapshot = 4;
  // The change afterwards.
  Change change = 5;
}

// The landing to read.
message GetLandingRequest {
  // The repository, by id or path.
  string repo = 1;
  // A landing id. Set this or `change`.
  string id = 2;
  // A change id (hex, or a unique prefix): its latest landing.
  string change = 3;
  // Also return the policy bytes the landing evaluated.
  bool include_policy = 4;
}

// One landing.
message GetLandingResponse {
  // The landing.
  Landing landing = 1;
  // The policy text its evaluation ran, when asked and known.
  string policy = 2;
}

// Which landings to list.
message ListLandingsRequest {
  // The repository, by id or path.
  string repo = 1;
  // Destination bookmarks; empty for all.
  repeated string destinations = 2;
  // Outcomes; empty for all.
  repeated LandingOutcome outcomes = 3;
  // Change ids (hex, or prefixes); empty for all.
  repeated string changes = 4;
  // Only landings that finished after this.
  google.protobuf.Timestamp finished_after = 5;
  // At most this many per page, up to 200; 0 for 50.
  int32 page_size = 6;
  // A previous response's `next_page_token`.
  string page_token = 7;
}

// A page of landings.
message ListLandingsResponse {
  // Newest first.
  repeated Landing landings = 1;
  // The next page's token; empty on the last page.
  string next_page_token = 2;
}

// The batch to read.
message GetBatchRequest {
  // The repository, by id or path.
  string repo = 1;
  // A batch id. Set this or `change`.
  string id = 2;
  // A change id (hex, or a unique prefix): the latest batch it was in.
  string change = 3;
}

// One batch.
message GetBatchResponse {
  // The batch.
  LandingBatch batch = 1;
}

// Which batches to list.
message ListBatchesRequest {
  // The repository, by id or path.
  string repo = 1;
  // Destination bookmarks; empty for all.
  repeated string destinations = 2;
  // Only batches not yet finished.
  bool open_only = 3;
  // Only batches that finished after this (open ones are always listed).
  google.protobuf.Timestamp finished_after = 4;
  // At most this many per page, up to 200; 0 for 50.
  int32 page_size = 5;
  // A previous response's `next_page_token`.
  string page_token = 6;
}

// A page of batches.
message ListBatchesResponse {
  // Newest first.
  repeated LandingBatch batches = 1;
  // The next page's token; empty on the last page.
  string next_page_token = 2;
}
