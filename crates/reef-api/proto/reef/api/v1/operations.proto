// The operation log: every change to a repository is one jj operation.
//
// `repo` accepts a repo id, a unique id prefix of four or more hex
// characters, or an absolute path inside a registered root. One that names
// none is NOT_FOUND, reason REPOSITORY_NOT_FOUND (metadata `repo`), or for
// a path, REPOSITORY_NOT_REGISTERED (metadata `path`). Operation ids
// are full lowercase hex; a request may name one by a unique prefix.
//
// Every RPC that records an operation reads the `reef-agent` request
// metadata (visible ASCII, at most 256 bytes, else INVALID_ARGUMENT with
// reason INVALID_AGENT) and writes it as the operation's `reef.agent`
// attribute, with `reef.kind`, `reef.workspace` and, for a snapshot,
// `reef.snapshot-kind` (R2.03). The metadata names who caused a write; it
// is not authentication.
syntax = "proto3";

package reef.api.v1;

import "google/protobuf/timestamp.proto";
import "reef/api/v1/options.proto";

// Reading, undoing, and following the operation log.
service OperationService {
  // Operations newest first from the operation heads, as `jj op log` lists
  // them, filtered. Never writes: concurrent operation heads are walked,
  // not merged. A page examines at most 10,000 operations and stops before
  // its response passes 3 MiB, so it may hold fewer than `page_size`
  // operations, or none, with a `next_page_token`.
  //
  // Errors: INVALID_ARGUMENT with reason INVALID_PAGE_TOKEN, or
  // INVALID_CHANGE_ID (metadata `change`) for a `filter.changes` value that
  // is not a hex or reverse-hex prefix; NOT_FOUND for an unknown
  // `filter.workspaces` value, or with reason OPERATION_NOT_FOUND
  // (metadata `operation_id`) when a page token's operation is gone.
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // One operation, with its effects.
  //
  // Errors: INVALID_ARGUMENT with reason INVALID_OPERATION_ID (not lowercase
  // hex, or empty) or AMBIGUOUS_OPERATION_ID (metadata `operation_id`);
  // NOT_FOUND with reason OPERATION_NOT_FOUND (metadata `operation_id`).
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Undoes exactly one operation, as `jj op revert` does, recording a new
  // operation: what it created is abandoned or rewritten back, what it hid
  // comes back, and the bookmarks and working copies it moved go back;
  // later operations stay. Workspaces the undo moves are snapshotted first
  // and take the result afterwards (ADR 0031); a workspace that stays on
  // its change keeps edits made after its snapshot, carried onto its new
  // commit (ADR 0039). When there is nothing to revert, `operation` is
  // unset.
  //
  // Never undone (INVALID_ARGUMENT, reason OPERATION_NOT_UNDOABLE): the
  // root operation, a merge of concurrent operations, one that adds or
  // forgets a workspace (create, release), a workspace move (move it back
  // instead), and one that changed git refs or git's HEAD. An operation
  // something later changed again (FAILED_PRECONDITION, reason
  // OPERATION_SUPERSEDED) is refused rather than merged, so an undo never
  // leaves a change divergent; undo the later ones first, newest first.
  //
  // Errors: as for GetOperation, and FAILED_PRECONDITION with reason
  // OPERATION_NOT_IN_HISTORY (not an ancestor of the head) or
  // OPERATION_SUPERSEDED (metadata `operation_id` for these and
  // OPERATION_NOT_UNDOABLE), for a `workspace` that is not active, or with
  // reason SNAPSHOT_FAILED (metadata `workspace_id`) when a workspace could
  // not be snapshotted first (nothing is written).
  rpc UndoOperation(UndoOperationRequest) returns (UndoOperationResponse) {
    option (reef.api.v1.access) = ACCESS_WRITE;
  }
  // New operations as they are recorded, in frames, optionally replaying
  // history first. A frame with no operations is a keepalive, sent at least
  // every 30 seconds.
  //
  // Within a repository every operation comes after its parents, across
  // frames too, and none comes twice; repositories interleave. The first
  // frame of a subscription with a start replays history (`live` false);
  // the first live frame is sent as soon as the replay is, and at once when
  // there is no start, empty when nothing is new. A frame holds at most
  // 1,000 operations and 1 MiB; live frames with operations are at least
  // 50 ms apart, and an isolated operation is not delayed. Nothing is
  // dropped: a client that stops reading is held back and catches up from
  // the log when it reads again, unless more than 10,000 operations were
  // recorded after its position. Operations written by other jj processes
  // arrive within about 200 ms.
  //
  // Errors: INVALID_ARGUMENT with reason INVALID_CURSOR; with reason
  // INVALID_OPERATION_ID or AMBIGUOUS_OPERATION_ID (metadata
  // `operation_id`) for `after_operation`; with reason INVALID_CHANGE_ID
  // (metadata `change`) for `filter.changes`; for an unknown
  // `filter.kinds` value; and for `after_operation` without exactly one
  // repository in `repos`. NOT_FOUND with reason REPOSITORY_NOT_FOUND
  // (metadata `repo`), also mid-stream when a named repository is
  // forgotten; REPOSITORY_NOT_REGISTERED (metadata `path`); for an unknown
  // `filter.workspaces` value; and OPERATION_NOT_FOUND (metadata
  // `operation_id`) for `after_operation`. FAILED_PRECONDITION with reason
  // OPERATION_NOT_IN_HISTORY (metadata `operation_id`); TOO_FAR_BEHIND
  // (metadata `repo_id`), at the start or mid-stream; and
  // OPERATION_LOG_REWRITTEN (metadata `repo_id`), for a cursor or
  // mid-stream after garbage collection. UNAVAILABLE with reason
  // TOO_MANY_SUBSCRIPTIONS, and with no reason, mid-stream, when the
  // daemon shuts down: resume with the last frame's `cursor`.
  rpc SubscribeOperations(SubscribeOperationsRequest) returns (stream SubscribeOperationsResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// What an operation did, as classified by the daemon.
enum OperationKind {
  // Not classified.
  OPERATION_KIND_UNSPECIFIED = 0;
  // A snapshot of a workspace's files; see `Operation.snapshot_kind`.
  OPERATION_KIND_SNAPSHOT = 1;
  // A workspace was created.
  OPERATION_KIND_CREATE_WORKSPACE = 2;
  // A workspace was released or reclaimed and its jj workspace forgotten.
  OPERATION_KIND_RELEASE_WORKSPACE = 3;
  // A workspace was moved to another change.
  OPERATION_KIND_MOVE_WORKSPACE = 4;
  // A change's description was set.
  OPERATION_KIND_DESCRIBE = 5;
  // A change was abandoned.
  OPERATION_KIND_ABANDON = 6;
  // An operation was undone.
  OPERATION_KIND_UNDO = 7;
  // Files were edited without a materialized directory (R2.04).
  OPERATION_KIND_EDIT = 8;
  // A colocated repository's git refs were imported.
  OPERATION_KIND_IMPORT_REFS = 9;
  // Written by another jj client, such as `jj` in the registered root.
  OPERATION_KIND_EXTERNAL = 10;
  // Written by Reef, and not one of the above, such as repository
  // initialization.
  OPERATION_KIND_OTHER = 11;
}

// Why a snapshot ran.
enum SnapshotKind {
  // Not a snapshot, or not known.
  SNAPSHOT_KIND_UNSPECIFIED = 0;
  // The file watcher saw edits.
  SNAPSHOT_KIND_WATCHER = 1;
  // A client asked for it (`SnapshotWorkspace`, or a read that snapshots
  // first).
  SNAPSHOT_KIND_EXPLICIT = 2;
  // Before a release or reclaim.
  SNAPSHOT_KIND_FINAL = 3;
  // Before a move to another change.
  SNAPSHOT_KIND_MOVE = 4;
  // Before the daemon shut down.
  SNAPSHOT_KIND_SHUTDOWN = 5;
}

// One jj operation.
message Operation {
  // Full hex.
  string id = 1;
  // The repository it belongs to.
  string repo_id = 2;
  // Parent operations; more than one for a merge of concurrent operations.
  repeated string parent_ids = 3;
  // jj's description, such as `reef: create workspace <id>`.
  string description = 4;
  // When the operation started.
  google.protobuf.Timestamp started_at = 5;
  // When the operation ended.
  google.protobuf.Timestamp ended_at = 6;
  // The host recorded by the writer.
  string hostname = 7;
  // The user recorded by the writer.
  string username = 8;
  // Whether the operation only snapshotted a working copy.
  bool is_snapshot = 9;
  // What it did.
  OperationKind kind = 10;
  // Why it snapshotted, when `kind` is OPERATION_KIND_SNAPSHOT.
  SnapshotKind snapshot_kind = 11;
  // The Reef workspace it was recorded for: from jj's workspace name
  // `reef-<id>`, or the workspace the RPC that wrote it named (a create,
  // move, or release runs in jj's `default` workspace); empty if none.
  string workspace_id = 12;
  // jj's workspace name when it is not a Reef workspace, such as `default`;
  // empty for a Reef workspace's operations.
  string jj_workspace = 13;
  // The agent that caused it: the operation attribute `reef.agent` (the
  // `reef-agent` request metadata of the RPC that wrote it, else the
  // workspace's owner), else the workspace's owner; empty if unknown.
  string agent = 14;
  // jj's operation attributes, verbatim.
  map<string, string> attributes = 15;
  // What it changed in the repository's view; unset when not computed. Each
  // RPC says whether it computes them.
  OperationEffects effects = 16;
}

// What an operation changed, from the difference between its view and its
// parents'.
message OperationEffects {
  // Changes created, rewritten, hidden, or abandoned, one entry per commit,
  // sorted by change id then commit id; at most 1,000.
  repeated ChangeEffect changes = 1;
  // Bookmarks set, moved, or deleted, local before remote, sorted by name;
  // at most 1,000. The `git` remote is left out.
  repeated BookmarkEffect bookmarks = 2;
  // Working-copy commits that moved, sorted by jj workspace name.
  repeated WorkingCopyEffect working_copies = 3;
  // Change entries in all; more than `changes` holds when it was capped.
  uint32 change_count = 4;
  // Bookmark entries in all; more than `bookmarks` holds when it was
  // capped.
  uint32 bookmark_count = 5;
}

// How an operation changed a change.
enum ChangeEffectKind {
  // Not set.
  CHANGE_EFFECT_KIND_UNSPECIFIED = 0;
  // A new change.
  CHANGE_EFFECT_KIND_CREATED = 1;
  // A new commit for an existing change.
  CHANGE_EFFECT_KIND_REWRITTEN = 2;
  // The change is no longer visible.
  CHANGE_EFFECT_KIND_ABANDONED = 3;
  // One of the change's commits is no longer visible, and the change still
  // is, through another: a divergent change resolved.
  CHANGE_EFFECT_KIND_HIDDEN = 4;
}

// One change an operation touched.
message ChangeEffect {
  // The change, in hex.
  string change_id = 1;
  // How it changed.
  ChangeEffectKind kind = 2;
  // Its commit afterwards; empty when abandoned.
  string commit_id = 3;
  // Its commit before; empty when created.
  string previous_commit_id = 4;
}

// One bookmark an operation touched.
message BookmarkEffect {
  // The bookmark's name.
  string name = 1;
  // The remote, for a remote-tracking bookmark; empty for a local one.
  string remote = 2;
  // Where it points afterwards; empty when deleted.
  string commit_id = 3;
  // Where it pointed before; empty when created.
  string previous_commit_id = 4;
  // The bookmark is conflicted afterwards; `commit_id` is the first of its
  // targets.
  bool conflicted = 5;
}

// One working-copy commit an operation moved.
message WorkingCopyEffect {
  // The Reef workspace; empty for another jj workspace.
  string workspace_id = 1;
  // The jj workspace's name when it is not a Reef workspace.
  string jj_workspace = 2;
  // Its working-copy commit afterwards; empty when the workspace was
  // forgotten.
  string commit_id = 3;
  // Its working-copy commit before; empty when the workspace was added.
  string previous_commit_id = 4;
}

// Which operations to return. An empty field is no constraint; values
// within a field are ORed, and fields are ANDed.
message OperationFilter {
  // Workspace ids or unique prefixes the operation was recorded for.
  repeated string workspaces = 1;
  // Change id prefixes, in hex or jj's reverse hex, matched against the
  // operation's effects.
  repeated string changes = 2;
  // Agents, matched against `Operation.agent`.
  repeated string agents = 3;
  // Kinds, matched against `Operation.kind`.
  repeated OperationKind kinds = 4;
}

// A page of the operation log.
message ListOperationsRequest {
  // The repository.
  string repo = 1;
  // Which operations; unset for all.
  OperationFilter filter = 2;
  // Only operations that ended after this; unset for no bound. The walk
  // stops at the first operation that ended at or before it, so with
  // clocks skewed across hosts sharing a repository, older-looking
  // operations past that point are left out.
  google.protobuf.Timestamp ended_after = 3;
  // Only operations that ended before this; unset for no bound.
  google.protobuf.Timestamp ended_before = 4;
  // Compute each operation's effects.
  bool include_effects = 5;
  // Operations per page: 0 means 100, more than 1,000 means 1,000, and a
  // negative value is INVALID_ARGUMENT. A page may hold fewer.
  int32 page_size = 6;
  // The previous page's `next_page_token`; empty for the first page. A
  // token sent with different filters is INVALID_ARGUMENT, reason
  // INVALID_PAGE_TOKEN.
  string page_token = 7;
}

// A page of the operation log, newest first.
message ListOperationsResponse {
  // The operations.
  repeated Operation operations = 1;
  // The token for the next page; empty on the last page.
  string next_page_token = 2;
}

// One operation.
message GetOperationRequest {
  // The repository.
  string repo = 1;
  // An operation id or unique prefix.
  string operation_id = 2;
}

// One operation.
message GetOperationResponse {
  // The operation, with its effects.
  Operation operation = 1;
}

// Undo one operation.
message UndoOperationRequest {
  // The repository.
  string repo = 1;
  // A workspace to snapshot first and check out afterwards, reported as
  // `snapshot`. Other workspaces the undo moves are snapshotted first and
  // then adopt it, by R1.13's staleness rules. Empty for none.
  string workspace = 2;
  // The operation to undo, as an id or unique prefix. Required.
  string operation_id = 3;
}

// What an undo recorded.
message UndoOperationResponse {
  // The operation that undid it.
  Operation operation = 1;
  // The snapshot of `workspace` taken first, if one was recorded.
  Operation snapshot = 2;
  // The operation undone, full hex.
  string undone_operation_id = 3;
}

// Follow the operation log.
message SubscribeOperationsRequest {
  // Repositories to follow; empty for every repository, including ones
  // registered later.
  repeated string repos = 1;
  // Which operations; unset for all.
  OperationFilter filter = 2;
  // Where to start; neither for new operations only.
  oneof start {
    // Replay the operations after this one first. Requires exactly one
    // repository in `repos`.
    string after_operation = 3;
    // Resume after a frame, from that frame's `cursor`.
    string cursor = 4;
  }
}

// One frame of the operation log.
message SubscribeOperationsResponse {
  // Parents before children within a repository, each with its effects.
  // Empty in a keepalive.
  repeated Operation operations = 1;
  // The point to resume from after this frame. Not bound to the filter.
  string cursor = 2;
  // False while replaying history after `after_operation` or `cursor`;
  // true from the first frame of new operations on. The first live frame
  // is sent at once, empty when nothing is new.
  bool live = 3;
  // When `repos` names exactly one repository: the operation heads this
  // frame's `cursor` stands at in it, full hex, sorted. Every operation that
  // is one of them or their ancestor has been sent or filtered out, so one
  // of them is an `after_operation` to resume from. One id unless the log
  // has concurrent heads. Empty when following several repositories.
  repeated string head_operation_ids = 4;
}
