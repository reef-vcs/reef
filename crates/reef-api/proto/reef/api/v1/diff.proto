// Diffs between revisions. `revision`, `at_operation` and `skip_snapshot`
// are as in changes.proto. With `symbols`, a diff also reports each file's
// added, removed, changed and moved definitions and their call sites, from
// the symbol index (symbols.proto; R2.15, ADR 0043).
syntax = "proto3";

package reef.api.v1;

import "reef/api/v1/files.proto";
import "reef/api/v1/options.proto";
import "reef/api/v1/symbols.proto";

// Diffs.
service DiffService {
  // The files that differ between two revisions, in path order, with
  // hunks or line counts on request. Renames and copies are detected when
  // at most 1,000 files differ, as git's default `diff.renameLimit`; past
  // that, files are added and deleted. A page stops before its response
  // passes 3 MiB, so it may hold fewer than `page_size` files.
  //
  // With `symbols`, each file also carries its symbol changes, matched
  // across the whole diff by symbol string, when at most 1,000 files
  // differ: every file says whether the index could answer for it
  // (`FileSymbolDiff.coverage`), and the diff never fails for a missing
  // index. Call sites are references in the new tree. With
  // `expand_symbols`, only the named symbols' lines are returned.
  //
  // Errors: as in changes.proto; INVALID_ARGUMENT with reason INVALID_PATH
  // (metadata `path`) for a `paths` value that is not a
  // repository-relative `/`-separated path, or INVALID_SYMBOL_QUERY
  // (metadata `field`) for `expand_symbols` without DIFF_FORMAT_HUNKS, with
  // an empty entry or with more than 100, or for `max_call_sites` or
  // `symbol_source` without `symbols` or `expand_symbols`; and
  // FAILED_PRECONDITION with reason SYMBOLS_DISABLED for `symbols` or
  // `expand_symbols` when the symbol index is disabled.
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = IDEMPOTENT;
  }
}

// How much of each file's diff to return.
enum DiffFormat {
  // DIFF_FORMAT_SUMMARY.
  DIFF_FORMAT_UNSPECIFIED = 0;
  // Paths and kinds only.
  DIFF_FORMAT_SUMMARY = 1;
  // Paths, kinds, and lines added and removed.
  DIFF_FORMAT_STAT = 2;
  // Everything in DIFF_FORMAT_STAT, and the hunks.
  DIFF_FORMAT_HUNKS = 3;
}

// A diff.
message GetDiffRequest {
  // The repository; may be empty when `workspace` is named.
  string repo = 1;
  // The workspace `@` refers to; empty for none.
  string workspace = 2;
  // The old side; empty for `to_revision`'s parents, merged as `jj diff -r`
  // does.
  string from_revision = 3;
  // The new side; empty for `@`, which requires `workspace`.
  string to_revision = 4;
  // Path prefixes to diff, matched by whole components (`src` matches
  // `src/a.rs`, not `srcx`); empty for every path.
  repeated string paths = 5;
  // How much to return.
  DiffFormat format = 6;
  // Lines of context around each hunk; unset for 3.
  optional uint32 context_lines = 7;
  // Hunk lines per file at most: 0 means 1,000. A longer file's hunks are
  // cut and `FileDiff.truncated` set; hunks also stop at 1 MiB per file.
  uint32 max_lines_per_file = 8;
  // Read at this operation; empty for the head.
  string at_operation = 9;
  // Answer from the last recorded snapshot instead of snapshotting first.
  bool skip_snapshot = 10;
  // Files per page: 0 means 100, more than 1,000 means 1,000, and a
  // negative value is INVALID_ARGUMENT. A page may hold fewer.
  int32 page_size = 11;
  // The previous page's `next_page_token`; empty for the first page. A
  // token sent with different fields is INVALID_ARGUMENT, reason
  // INVALID_PAGE_TOKEN.
  string page_token = 12;
  // Report each file's symbol changes in `FileDiff.symbols`, and the totals
  // in `GetDiffResponse.symbol_summary`.
  bool symbols = 13;
  // Call sites listed per changed, removed or moved symbol: unset means 10,
  // 0 looks none up, and more than 100 is 100. Needs `symbols` or
  // `expand_symbols`.
  optional uint32 max_call_sites = 14;
  // With DIFF_FORMAT_HUNKS: return only the files with a change to one of
  // these symbols, and as their hunks only those symbols' lines. Each entry
  // is a symbol string, a suffix of one beginning after a descriptor
  // boundary (the final `.` may be left off), or a display name; at most
  // 100. Implies `symbols`.
  repeated string expand_symbols = 15;
  // The source every file pair answers from; unspecified: SCIP when both
  // sides have an uploaded document, else tags. Needs `symbols` or
  // `expand_symbols`.
  SymbolSource symbol_source = 16;
}

// A page of a diff.
message GetDiffResponse {
  // The files, in path order.
  repeated FileDiff files = 1;
  // The token for the next page; empty on the last page.
  string next_page_token = 2;
  // The old side's commits: more than one when it is a merge of parents.
  repeated string from_commit_ids = 3;
  // The new side's commit.
  string to_commit_id = 4;
  // The operation it was read at.
  string at_operation = 5;
  // Files that differ, over every page.
  uint32 total_files = 6;
  // The symbol changes over every page (`to_index` is this page's); unset
  // without `symbols`.
  SymbolDiffSummary symbol_summary = 7;
}

// One file's diff.
message FileDiff {
  // The path and how it differs.
  FileChange change = 1;
  // Either side is binary; there are no hunks.
  bool binary = 2;
  // Either side is conflicted.
  bool conflict = 3;
  // Lines added, with DIFF_FORMAT_STAT and DIFF_FORMAT_HUNKS.
  uint32 lines_added = 4;
  // Lines removed, with DIFF_FORMAT_STAT and DIFF_FORMAT_HUNKS.
  uint32 lines_removed = 5;
  // The hunks, with DIFF_FORMAT_HUNKS.
  repeated Hunk hunks = 6;
  // `hunks` was cut at `max_lines_per_file` or at 1 MiB.
  bool truncated = 7;
  // The old side does not end with a newline: its last line in `hunks` had
  // one added. With DIFF_FORMAT_HUNKS.
  bool old_no_final_newline = 8;
  // The new side does not end with a newline, as for the old side.
  bool new_no_final_newline = 9;
  // A side is larger than 16 MiB: no line counts and no hunks. With
  // DIFF_FORMAT_STAT and DIFF_FORMAT_HUNKS.
  bool too_large = 10;
  // A side is not valid UTF-8: `hunks` show U+FFFD for the bytes that are
  // not; the line counts are exact.
  bool invalid_utf8 = 11;
  // The file's symbol changes; unset without `symbols`.
  FileSymbolDiff symbols = 12;
}

// One hunk of a unified diff.
message Hunk {
  // The first old line, counting from 1.
  uint32 old_start = 1;
  // How many old lines.
  uint32 old_lines = 2;
  // The first new line, counting from 1.
  uint32 new_start = 3;
  // How many new lines.
  uint32 new_lines = 4;
  // The unified-diff body: each line prefixed with ' ', '-' or '+', and
  // newline-terminated.
  string lines = 5;
}

// How a definition differs.
enum SymbolChangeKind {
  // Not set.
  SYMBOL_CHANGE_KIND_UNSPECIFIED = 0;
  // Only in the new tree.
  SYMBOL_CHANGE_KIND_ADDED = 1;
  // Only in the old tree.
  SYMBOL_CHANGE_KIND_REMOVED = 2;
  // In both, with other bytes.
  SYMBOL_CHANGE_KIND_CHANGED = 3;
  // In both with the same bytes, in another file than its own (a renamed
  // file's definitions are not moved), or under another symbol with the
  // same name, kind and bytes. A definition the index has no range for is
  // moved when its file differs, whatever its bytes.
  SYMBOL_CHANGE_KIND_MOVED = 4;
}

// Whether the symbol index could answer for a file.
enum SymbolCoverage {
  // Symbols were not asked for.
  SYMBOL_COVERAGE_UNSPECIFIED = 0;
  // Each side that exists has an entry from the pair's source; a side in
  // an unsupported language without SCIP has no definitions. `changes` is
  // complete.
  SYMBOL_COVERAGE_COVERED = 1;
  // No source reads the file: neither side is a supported file type and
  // neither has SCIP, `symbol_source` is TAGS for a file only SCIP reads,
  // or a conflicted side is not a supported file type. No changes.
  SYMBOL_COVERAGE_UNSUPPORTED = 2;
  // A side was skipped, for `skip_reason`: no changes.
  SYMBOL_COVERAGE_SKIPPED = 3;
  // `symbol_source` is SCIP and a side has no uploaded document: no
  // changes.
  SYMBOL_COVERAGE_NO_SCIP = 4;
  // More than 1,000 files differ, so no file's symbols were computed;
  // naming `paths` narrows the diff.
  SYMBOL_COVERAGE_DIFF_TOO_LARGE = 5;
}

// Whether a change's call sites were looked up.
enum CallSiteStatus {
  // Not looked up: not asked for, an added symbol, or one changed only
  // inside its nested definitions.
  CALL_SITE_STATUS_UNSPECIFIED = 0;
  // Every call site was counted; up to `max_call_sites` are listed.
  CALL_SITE_STATUS_FOUND = 1;
  // More than 10,000 candidates: `call_site_count` is a lower bound.
  CALL_SITE_STATUS_CAPPED = 2;
  // Tags record no references to this kind of symbol (fields, variables,
  // constants, modules).
  CALL_SITE_STATUS_NOT_TRACKED = 3;
  // The new tree was still being indexed after the request's wait, or the
  // lookup failed; index it with IndexSymbols and ask again.
  CALL_SITE_STATUS_INDEX_INCOMPLETE = 4;
  // Not looked up to keep the page within its bounds; ListSymbols lists
  // them.
  CALL_SITE_STATUS_PAGE_LIMIT = 5;
}

// One definition that differs.
message SymbolChange {
  // How.
  SymbolChangeKind kind = 1;
  // Its symbol string: the new side's, or the old side's when removed.
  string symbol = 2;
  // The old side's symbol when it differs from `symbol`: in a renamed
  // file, or for a move found by name, kind and bytes.
  string old_symbol = 3;
  // Its display name.
  string name = 4;
  // What it is.
  SymbolKind symbol_kind = 5;
  // The innermost definition containing it, on the side `symbol` is from;
  // empty at the top level.
  string enclosing_symbol = 6;
  // The old definition's file, when it is neither this file nor this
  // file's own old path.
  string old_path = 7;
  // The old definition's range, from any decorator to its end; unset when
  // added or when the index has none.
  SourceRange old_range = 8;
  // The new definition's range; unset when removed or when the index has
  // none.
  SourceRange new_range = 9;
  // Lines added within the definition, nested ones included.
  uint32 lines_added = 10;
  // Lines removed within the definition, nested ones included.
  uint32 lines_removed = 11;
  // Changed only inside definitions nested in it, on both sides: a class
  // whose methods changed. Its own call sites are not looked up.
  bool nested_only = 12;
  // Whether its call sites were looked up.
  CallSiteStatus call_site_status = 13;
  // Call sites found, counted up to 10,000 candidates.
  uint32 call_site_count = 14;
  // Up to `max_call_sites` of them, in path order and then by position:
  // references in the new tree, other than inside the definition itself.
  // `enclosing_symbol` is the caller; `source` says whether it was found by
  // exact symbol (SCIP) or by name (tags).
  repeated SymbolOccurrence call_sites = 15;
  // With call sites found by name: the definitions in the new tree with
  // that name and a compatible kind, in the same language family. More
  // than one means some call sites may be another definition's; zero, for
  // a removed symbol, means none remains.
  uint32 name_definitions = 16;
}

// One file's symbol changes.
message FileSymbolDiff {
  // Whether the index could answer for the file.
  SymbolCoverage coverage = 1;
  // Why a side was skipped, with SYMBOL_COVERAGE_SKIPPED.
  SymbolSkipReason skip_reason = 2;
  // The source the pair answered from, with SYMBOL_COVERAGE_COVERED.
  SymbolSource source = 3;
  // A side parsed with syntax errors: definitions in the damaged part may
  // be missing.
  bool parse_errors = 4;
  // The changes: those with a new side in new-file order, then removed
  // ones in old-file order.
  repeated SymbolChange changes = 5;
  // More than 1,000 changes: the rest are counted in the summary only.
  bool truncated = 6;
}

// The symbol changes of a whole diff: the counts are over every page and
// the same on each; `to_index` is the page's own.
message SymbolDiffSummary {
  // Definitions added.
  uint32 added = 1;
  // Definitions removed.
  uint32 removed = 2;
  // Definitions changed.
  uint32 changed = 3;
  // Definitions moved.
  uint32 moved = 4;
  // Files with SYMBOL_COVERAGE_COVERED.
  uint32 files_covered = 5;
  // Files with SYMBOL_COVERAGE_UNSUPPORTED.
  uint32 files_unsupported = 6;
  // Files with SYMBOL_COVERAGE_SKIPPED or SYMBOL_COVERAGE_NO_SCIP.
  uint32 files_skipped = 7;
  // More than 1,000 files differ: nothing was computed.
  bool diff_too_large = 8;
  // The new tree's indexing as this page's call sites saw it; unset when
  // the page looked none up, so it can differ between pages.
  SymbolIndexStatus to_index = 9;
}
