// The state of a repository and of a workspace, in one call.
syntax = "proto3";

package reef.api.v1;

import "reef/api/v1/changes.proto";
import "reef/api/v1/files.proto";
import "reef/api/v1/operations.proto";
import "reef/api/v1/options.proto";
import "reef/api/v1/repositories.proto";
import "reef/api/v1/workspaces.proto";

// Status.
service StatusService {
  // What the repository looks like now, and, when a workspace is named,
  // what that workspace has changed. Snapshots the workspace first unless
  // `skip_snapshot`. R2.23 changes how it is answered, not its shape.
  //
  // With `at_operation` (R2.12), what the repository looked like at that
  // operation instead: its view's trunk, heads and conflicts, the
  // workspaces whose working copy it holds, and, for a named workspace in
  // any state now, its working copy then. Never snapshots, and leaves out
  // what the operation log does not record (see each field).
  //
  // Errors: FAILED_PRECONDITION for a workspace that is not active, unless
  // `at_operation` is set; INVALID_ARGUMENT with reason
  // INVALID_OPERATION_ID or AMBIGUOUS_OPERATION_ID (metadata
  // `operation_id`), or NOT_FOUND with reason OPERATION_NOT_FOUND (metadata
  // `operation_id`), for `at_operation`;
  // INVALID_ARGUMENT for a negative `max_files`; NOT_FOUND with reason
  // WORKING_COPY_NOT_FOUND (metadata `workspace_id`, `at_operation`) for a
  // workspace released while the status was read; and a failed snapshot's
  // own error, with reason SNAPSHOT_FAILED (metadata `workspace_id`).
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = IDEMPOTENT;
  }
}

// Where a workspace's status came from.
enum StatusSource {
  // Not set.
  STATUS_SOURCE_UNSPECIFIED = 0;
  // A snapshot this request took, or found nothing new to record.
  STATUS_SOURCE_SNAPSHOT = 1;
  // The incremental index (R2.23).
  STATUS_SOURCE_INDEX = 2;
  // A walk of the tree, the index's fallback (R2.23).
  STATUS_SOURCE_WALK = 3;
  // The last recorded snapshot, with `skip_snapshot`: edits since then may
  // be missing.
  STATUS_SOURCE_LAST_SNAPSHOT = 4;
  // The view at `at_operation`: the working copy as that operation
  // recorded it (R2.12).
  STATUS_SOURCE_OPERATION = 5;
}

// Status of a repository, and optionally of one workspace.
message GetStatusRequest {
  // The repository; may be empty when `workspace` is named.
  string repo = 1;
  // A workspace; empty for the repository's status only.
  string workspace = 2;
  // Answer from the last recorded snapshot instead of snapshotting first.
  bool skip_snapshot = 3;
  // How many changed files to return at most: 0 means 100, more than
  // 1,000 means 1,000, and a negative value is INVALID_ARGUMENT. Caps
  // `changed_files`, never `changed_file_count`.
  int32 max_files = 4;
  // Read at this operation's view instead of now (R2.12): an operation id
  // or unique prefix of lowercase hex; empty for now. Never snapshots,
  // whatever `skip_snapshot` says.
  string at_operation = 5;
}

// Status.
message GetStatusResponse {
  // The repository.
  Repository repository = 1;
  // The operation it was read at.
  string at_operation = 2;
  // The repository's state.
  RepositoryStatus repository_status = 3;
  // The workspace's state; set when a workspace was named.
  WorkspaceStatus workspace_status = 4;
}

// A repository's state.
message RepositoryStatus {
  // The default start's commit, `trunk()`; unset when no default start
  // bookmark exists.
  Change trunk = 1;
  // The default start's bookmark; empty when none exists.
  string trunk_bookmark = 2;
  // Active workspaces, newest 100. With `at_operation`, those whose working
  // copy the operation's view holds, as ListWorkspaces lists them then.
  repeated Workspace active_workspaces = 3;
  // Active workspaces, in all.
  uint32 active_workspace_count = 4;
  // Visible mutable heads outside trunk's ancestry, newest 100.
  repeated Change heads = 5;
  // Such heads, in all.
  uint32 head_count = 6;
  // Mutable changes with conflicts, at most 100.
  repeated string conflicted_change_ids = 7;
  // Divergent changes, at most 100.
  repeated string divergent_change_ids = 8;
  // The head operation, or `at_operation`.
  Operation last_operation = 9;
}

// A workspace's state.
message WorkspaceStatus {
  // The workspace.
  Workspace workspace = 1;
  // Its working-copy commit.
  Change working_copy = 2;
  // That commit's parents.
  repeated Change parents = 3;
  // Paths that differ from the parents, merged; at most `max_files`.
  repeated FileChange changed_files = 4;
  // Paths that differ, in all.
  uint32 changed_file_count = 5;
  // Conflicted paths in the working-copy commit, in path order; at most
  // 1,000.
  repeated string conflicted_paths = 6;
  // Where the answer came from.
  StatusSource source = 7;
  // The snapshot this request recorded, if it recorded one. Unset with
  // `at_operation`.
  Operation snapshot = 8;
  // Conflicted paths, in all.
  uint32 conflicted_path_count = 9;
}
