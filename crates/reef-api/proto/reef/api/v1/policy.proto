// Repository policy (R3.07, ADR 0061): `reef-policy.toml` at the root of a
// revision's tree, evaluated over one change. A policy declares trusted
// attestors, required evidence, size limits, forbidden paths, sign-off
// areas and conflict tiers, with CEL conditions and free CEL rules; the
// format is docs/policy.md's.
//
// Evaluation reads; it never refuses anything. The landing service
// enforces a decision (R3.13). The policy in force is the one on the
// destination's tree (`trunk()` by default), never the change's own, and a
// change to `reef-policy.toml` or `reef-checks.toml` needs the policy's
// owners' sign-off.
syntax = "proto3";

package reef.api.v1;

import "google/protobuf/timestamp.proto";
import "reef/api/v1/options.proto";

// Evaluating a repository's policy.
service PolicyService {
  // Evaluates the policy at `policy_revision` (or `policy` text) over the
  // change at `revision`: every rule, with the evidence still missing and
  // the sign-offs still needed. A missing policy (`NO_POLICY`), one that
  // does not load (`INVALID_POLICY`) and a blocked change (`BLOCK`) are
  // decisions, not errors: the call succeeded, and the answer is that the
  // change would not land.
  //
  // The input is the change's commit and diff against its parents, the
  // evidence on its tree whose signature verifies at this read, with each
  // signer's identity at witness time, and every provenance record of its
  // change. Evaluation is bounded: by the file's limits, a cost bound
  // computed before any expression runs, and caps on the input
  // (docs/policy.md).
  //
  // Errors: the revision reasons of ChangeService for `revision` and
  // `policy_revision`; INVALID_ARGUMENT with reason POLICY_SOURCE_CONFLICT
  // when both `policy` and `policy_revision` are set, and POLICY_TOO_LARGE
  // (metadata `bytes`, `max`) when `policy` is over 256 KiB; a failed
  // snapshot's own error, with reason SNAPSHOT_FAILED (metadata
  // `workspace_id`).
  rpc EvaluatePolicy(EvaluatePolicyRequest) returns (EvaluatePolicyResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Evaluates a proposed policy over recent landings and reports which it
  // would have blocked, and why (R3.08, ADR 0062). Until the landing
  // service records landings, a landing is a commit of `revisions`: by
  // default every non-merge ancestor of `trunk()`, newest first, each
  // judged as its own change, as EvaluatePolicy judges it. Each landing is
  // also evaluated under a baseline, the policy at `baseline_revision`
  // (`trunk()` by default), and compared with it.
  //
  // One page per call. A page stops at the first of: `page_size`
  // landings; the landing whose evaluations take the page's summed cost
  // past 100,000,000; the landing that takes the page's touched paths past
  // 200,000; the landing that takes the evidence and provenance rows its
  // landings read past 50,000; the landing that would take its landings'
  // encoded size past 3 MiB. A daemon reads at most two pages at once, and
  // each evaluation takes one of its evaluation turns. Later pages read the
  // operation the first page read. A proposed policy that does not load, or a revision
  // without one, is answered at once with no landing evaluated.
  //
  // Errors: the revision reasons of ChangeService for `revisions`,
  // `policy_revision` and `baseline_revision`; INVALID_ARGUMENT with reason
  // POLICY_SOURCE_CONFLICT when both `policy` and `policy_revision` are
  // set, POLICY_SOURCE_MISSING when neither is, POLICY_TOO_LARGE (metadata
  // `bytes`, `max`) when `policy` is over 256 KiB, and INVALID_PAGE_TOKEN;
  // a negative `page_size` is INVALID_ARGUMENT; a failed snapshot's own
  // error, with reason SNAPSHOT_FAILED (metadata `workspace_id`).
  rpc SimulatePolicy(SimulatePolicyRequest) returns (SimulatePolicyResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// What a policy decides about a change.
enum PolicyDecision {
  // Not set: never a decision the daemon returns.
  POLICY_DECISION_UNSPECIFIED = 0;
  // Every rule is satisfied or does not apply.
  POLICY_DECISION_ALLOW = 1;
  // Some rule is unsatisfied or errored.
  POLICY_DECISION_BLOCK = 2;
  // The policy revision's tree has no `reef-policy.toml`: nothing lands
  // automatically.
  POLICY_DECISION_NO_POLICY = 3;
  // The policy file does not load: nothing lands automatically.
  POLICY_DECISION_INVALID_POLICY = 4;
}

// Which kind of rule a result is for.
enum PolicyRuleKind {
  // Not set: never a kind the daemon returns.
  POLICY_RULE_KIND_UNSPECIFIED = 0;
  // `builtin:input`, `builtin:conflicts`, `builtin:policy-file` or
  // `builtin:owners`.
  POLICY_RULE_KIND_BUILTIN = 1;
  // A `[[require]]` entry.
  POLICY_RULE_KIND_REQUIRE = 2;
  // `[limits]`.
  POLICY_RULE_KIND_LIMITS = 3;
  // A `[[forbid]]` entry.
  POLICY_RULE_KIND_FORBID = 4;
  // A `[[signoff]]` entry.
  POLICY_RULE_KIND_SIGNOFF = 5;
  // A `[[rule]]` entry.
  POLICY_RULE_KIND_RULE = 6;
}

// A rule's outcome.
enum PolicyRuleStatus {
  // Not set: never a status the daemon returns.
  POLICY_RULE_STATUS_UNSPECIFIED = 0;
  // The rule holds.
  POLICY_RULE_STATUS_SATISFIED = 1;
  // The rule does not hold: it blocks.
  POLICY_RULE_STATUS_UNSATISFIED = 2;
  // The rule does not apply to this change.
  POLICY_RULE_STATUS_NOT_APPLICABLE = 3;
  // The rule could not be evaluated: it blocks.
  POLICY_RULE_STATUS_ERROR = 4;
}

// Which policy bytes were evaluated.
message PolicySource {
  // The policy revision as requested (`trunk()` when none was); empty for
  // request text.
  string revision = 1;
  // The commit it resolved to; empty for request text.
  string commit_id = 2;
  // `reef-policy.toml`; empty for request text.
  string path = 3;
  // The file's blob id at that commit; empty for request text or no file.
  string blob_id = 4;
  // The SHA-256 of the bytes evaluated, as hex; empty for no file.
  string sha256 = 5;
  // The format version the evaluator read: 1.
  uint32 version = 6;
  // The policy came from the request's `policy` text.
  bool from_request = 7;
}

// One problem with a policy file.
message PolicyDiagnostic {
  // The rule or table it is in, or empty for the file.
  string rule = 1;
  // The key it is about, or empty.
  string field = 2;
  // The line, from 1; 0 when not known.
  uint32 line = 3;
  // The column, from 1, in characters; 0 when not known.
  uint32 column = 4;
  // What is wrong.
  string message = 5;
}

// Evidence a requirement needs, by kind and target.
message PolicyEvidenceNeed {
  // The evidence kind.
  string kind = 1;
  // The target; empty for the whole check.
  string target = 2;
  // The attestor sets whose evidence counts.
  repeated string attestors = 3;
  // For a failed need, the failing object.
  repeated string evidence_ids = 4;
}

// A sign-off a rule needs, and what it has.
message PolicySignoff {
  // The groups whose members may sign.
  repeated string groups = 1;
  // The identities that may sign.
  repeated string identities = 2;
  // Distinct identities needed.
  uint32 count = 3;
  // Distinct identities that have signed.
  uint32 have = 4;
  // Who has, by identity name.
  repeated string signed_by = 5;
  // The least presence a sign-off's key needs: `none` or `user_verified`.
  string presence = 6;
  // The evidence kinds that count as a sign-off.
  repeated string kinds = 7;
}

// One rule's result.
message PolicyRuleResult {
  // The rule's name.
  string name = 1;
  // Its kind.
  PolicyRuleKind kind = 2;
  // Its outcome.
  PolicyRuleStatus status = 3;
  // Why, for a rule that is not satisfied.
  string message = 4;
  // The touched paths the rule is about, at most 20.
  repeated string paths = 5;
  // How many there are.
  uint32 paths_total = 6;
  // Evidence missing.
  repeated PolicyEvidenceNeed missing = 7;
  // Evidence whose newest trusted verdict is a failure.
  repeated PolicyEvidenceNeed failed = 8;
  // For a sign-off rule, what it needs and has.
  PolicySignoff signoff = 9;
  // The evidence that satisfied it.
  repeated string evidence_ids = 10;
}

// What the evaluation saw, in counts.
message PolicyInputSummary {
  // Touched paths.
  uint32 paths = 1;
  // Lines added.
  uint64 lines_added = 2;
  // Lines removed.
  uint64 lines_removed = 3;
  // Evidence objects the policy saw.
  uint32 evidence = 4;
  // Evidence objects left out: not verified, or untrusted over the cap.
  uint32 evidence_ignored = 5;
  // Provenance records of the change.
  uint32 provenance = 6;
  // The change is conflicted.
  bool conflicted = 7;
}

// A policy's decision about one change.
message PolicyEvaluation {
  // The decision.
  PolicyDecision decision = 1;
  // Which policy.
  PolicySource source = 2;
  // For INVALID_POLICY, every load error; otherwise warnings.
  repeated PolicyDiagnostic diagnostics = 3;
  // The change judged.
  string change_id = 4;
  // Its commit.
  string commit_id = 5;
  // Its tree; empty when conflicted.
  string tree_id = 6;
  // The operation it was read at.
  string at_operation = 7;
  // Every rule: the built-in ones first, then in file order.
  repeated PolicyRuleResult rules = 8;
  // What the evaluation saw.
  PolicyInputSummary input = 9;
  // The evaluation's cost bound, summed over the expressions it ran.
  uint64 cost = 10;
  // The input as JSON (`reef schema policy input`), with `include_input`.
  string input_json = 11;
}

// The change to judge and the policy to judge it by.
message EvaluatePolicyRequest {
  // The repository, by id or path; empty for the workspace's.
  string repo = 1;
  // A workspace id, for `@`.
  string workspace = 2;
  // The change judged: one commit. `@` by default with `workspace`;
  // required without.
  string revision = 3;
  // Where `reef-policy.toml` is read: a revision; empty for `trunk()`.
  string policy_revision = 4;
  // A policy file's bytes to evaluate instead, at most 256 KiB.
  bytes policy = 5;
  // Read at this operation instead of the head.
  string at_operation = 6;
  // Don't snapshot a workspace whose `@` the revision uses first.
  bool skip_snapshot = 7;
  // Fill `input_json`.
  bool include_input = 8;
}

// The policy's decision.
message EvaluatePolicyResponse {
  // The evaluation.
  PolicyEvaluation evaluation = 1;
}

// How a landing's decision under the proposed policy compares with its
// decision under the baseline. Blocked means anything but ALLOW.
enum PolicySimulationOutcome {
  // Not set: never an outcome the daemon returns.
  POLICY_SIMULATION_OUTCOME_UNSPECIFIED = 0;
  // The proposed policy blocks it; the baseline allows it.
  POLICY_SIMULATION_OUTCOME_NEWLY_BLOCKED = 1;
  // Both block it.
  POLICY_SIMULATION_OUTCOME_STILL_BLOCKED = 2;
  // The proposed policy allows it; the baseline blocks it.
  POLICY_SIMULATION_OUTCOME_NEWLY_ALLOWED = 3;
  // Both allow it.
  POLICY_SIMULATION_OUTCOME_STILL_ALLOWED = 4;
  // The proposed policy blocks it, and there is no baseline to compare
  // with: none was asked for, or the baseline revision has no policy.
  POLICY_SIMULATION_OUTCOME_BLOCKED = 5;
  // The proposed policy allows it, and there is no baseline to compare
  // with.
  POLICY_SIMULATION_OUTCOME_ALLOWED = 6;
}

// A proposed policy and the landings to judge with it.
message SimulatePolicyRequest {
  // The repository, by id or path; empty for the workspace's.
  string repo = 1;
  // A workspace id, for revsets that name `@`.
  string workspace = 2;
  // The landings: a revset, read newest first. Empty for every non-merge
  // ancestor of `trunk()`, `::trunk() ~ root() ~ merges()`.
  string revisions = 3;
  // The proposed policy's bytes, at most 256 KiB.
  bytes policy = 4;
  // Or the `reef-policy.toml` at this revision. Exactly one of `policy`
  // and `policy_revision`.
  string policy_revision = 5;
  // Where the baseline policy is read; empty for `trunk()`. Ignored with
  // `no_baseline`.
  string baseline_revision = 6;
  // Evaluate the proposed policy only, with no baseline.
  bool no_baseline = 7;
  // Read at this operation instead of the head.
  string at_operation = 8;
  // Don't snapshot a workspace whose `@` the revisions use first.
  bool skip_snapshot = 9;
  // Landings per page: 0 means 20, more than 100 means 100, and a negative
  // value is INVALID_ARGUMENT. A page may hold fewer.
  int32 page_size = 10;
  // The previous page's `next_page_token`; empty for the first page. A
  // token sent with different fields is INVALID_ARGUMENT, reason
  // INVALID_PAGE_TOKEN.
  string page_token = 11;
  // Fill each landing's `evaluation` and `baseline_evaluation`.
  bool include_evaluations = 12;
}

// One landing, judged by the proposed policy and the baseline.
message PolicySimulatedLanding {
  // Its change.
  string change_id = 1;
  // Its commit.
  string commit_id = 2;
  // Its tree; empty when conflicted.
  string tree_id = 3;
  // The first line of its description.
  string subject = 4;
  // Its author, as `name <email>`.
  string author = 5;
  // When it was committed.
  google.protobuf.Timestamp committed_at = 6;
  // The proposed policy's decision: ALLOW or BLOCK.
  PolicyDecision decision = 7;
  // The baseline's decision; UNSPECIFIED with `no_baseline`.
  PolicyDecision baseline_decision = 8;
  // How the two compare.
  PolicySimulationOutcome outcome = 9;
  // The proposed policy's rules that are unsatisfied or errored, in the
  // evaluation's order.
  repeated PolicyRuleResult unmet = 10;
  // The names of the baseline's rules that are unsatisfied or errored.
  repeated string baseline_unmet = 11;
  // Blocked by the proposed policy only for evidence that is missing:
  // every unmet rule is a required-evidence rule with no failed evidence.
  bool missing_evidence_only = 12;
  // The cost of both evaluations.
  uint64 cost = 13;
  // The proposed policy's full evaluation, with `include_evaluations`.
  PolicyEvaluation evaluation = 14;
  // The baseline's full evaluation, with `include_evaluations`.
  PolicyEvaluation baseline_evaluation = 15;
  // The landing alone was too large for a page: its full evaluations were
  // left out, and if that was not enough, the paths its unmet rules list
  // (their `paths_total` stays). EvaluatePolicy reports them for its commit.
  bool trimmed = 16;
}

// How many landings one rule of the proposed policy blocked.
message PolicySimulationRuleCount {
  // The rule's name.
  string name = 1;
  // Its kind.
  PolicyRuleKind kind = 2;
  // The landings it was unsatisfied or errored on.
  uint32 landings = 3;
}

// Counts over one page's landings.
message PolicySimulationSummary {
  // Landings evaluated.
  uint32 landings = 1;
  // Landings the proposed policy blocks.
  uint32 blocked = 2;
  // Of those, the ones blocked only for missing evidence.
  uint32 missing_evidence_only = 3;
  // Landings by outcome: NEWLY_BLOCKED.
  uint32 newly_blocked = 4;
  // STILL_BLOCKED.
  uint32 still_blocked = 5;
  // NEWLY_ALLOWED.
  uint32 newly_allowed = 6;
  // STILL_ALLOWED.
  uint32 still_allowed = 7;
  // Every rule of the proposed policy, built-ins first, then in file order,
  // with how many of the page's landings it blocked (0 for none); empty
  // for a page with no landings.
  repeated PolicySimulationRuleCount rules = 8;
}

// A page of a simulation.
message SimulatePolicyResponse {
  // Whether the proposed policy loads: ALLOW when it does (it says nothing
  // about any landing), NO_POLICY when `policy_revision` has no
  // `reef-policy.toml`, INVALID_POLICY when it does not load. With
  // NO_POLICY or INVALID_POLICY no landing is evaluated.
  PolicyDecision proposed_decision = 1;
  // The proposed policy's source.
  PolicySource proposed = 2;
  // The proposed policy's load errors, for INVALID_POLICY.
  repeated PolicyDiagnostic diagnostics = 3;
  // The baseline's source; empty with `no_baseline`.
  PolicySource baseline = 4;
  // The baseline's state: ALLOW when it loads, NO_POLICY when its revision
  // has none, INVALID_POLICY when it does not load; UNSPECIFIED with
  // `no_baseline`.
  PolicyDecision baseline_state = 5;
  // The landings of this page, newest first.
  repeated PolicySimulatedLanding landings = 6;
  // Counts over this page.
  PolicySimulationSummary summary = 7;
  // The page's evaluations' cost, summed.
  uint64 cost = 8;
  // The operation the landings were read at.
  string at_operation = 9;
  // The token for the next page; empty on the last page.
  string next_page_token = 10;
}
