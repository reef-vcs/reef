// The daemon itself.
syntax = "proto3";

package reef.api.v1;

import "reef/api/v1/options.proto";
import "reef/api/v1/workspaces.proto";

// The daemon's own status.
service DaemonService {
  // What the daemon is and what it serves. A client checks `api_revision`
  // before calling an RPC added after revision 1.
  rpc GetDaemonStatus(GetDaemonStatusRequest) returns (GetDaemonStatusResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // A session for the web UI (R2.18). Binds the daemon's loopback web
  // listener (`[ui] listen`) if it is not bound yet, and returns its address
  // and a new session. The session's token authorizes the web listener's
  // gRPC-web calls to ACCESS_READ methods until the daemon stops, or for 24
  // hours without use; it is never persisted. ADMIN: it mints a credential,
  // so it is served only where ADMIN is.
  //
  // Errors: FAILED_PRECONDITION with reason WEB_UI_DISABLED (`[ui] enabled
  // = false`) or WEB_UI_NOT_BUILT (the daemon embeds the placeholder, not
  // the app); UNAVAILABLE with reason WEB_UI_UNAVAILABLE (metadata
  // `address`, `error`) when the listener cannot be bound.
  rpc CreateWebSession(CreateWebSessionRequest) returns (CreateWebSessionResponse) {
    option (reef.api.v1.access) = ACCESS_ADMIN;
  }
}

// Ask for a web UI session.
message CreateWebSessionRequest {
  // Also write a launch file: a page only the daemon's user can read that
  // sends a browser on to `session_url`, so the token need not appear on a
  // command line. Deleted at the session's first request or after 60
  // seconds. False: `launch_path` is empty.
  bool launch_file = 1;
}

// A web UI session.
message CreateWebSessionResponse {
  // The web UI's address, such as `http://127.0.0.1:52817/`. No token.
  string url = 1;
  // `url` with the session's token in its fragment (`#session=<token>`).
  // A credential: whoever holds it can read every registered repository
  // through the web listener while the session lives.
  string session_url = 2;
  // The launch file's absolute path; empty unless `launch_file`.
  string launch_path = 3;
}

// Ask for the daemon's status.
message GetDaemonStatusRequest {
  // Skip the backend probe, which touches the filesystem; `backends` is
  // then empty.
  bool skip_backends = 1;
}

// The daemon's status.
message GetDaemonStatusResponse {
  // The daemon's version, such as `0.2.0`.
  string version = 1;
  // The revision of `reef.api.v1` it serves; it increases with every
  // addition to the schema.
  uint32 api_revision = 2;
  // The daemon instance's id, which a backup and restore keep.
  string instance_id = 3;
  // The daemon's process id.
  uint32 pid = 4;
  // Milliseconds since the daemon started.
  uint64 uptime_ms = 5;
  // The state directory.
  string state_dir = 6;
  // The socket this answer came over.
  string socket = 7;
  // The metadata database's schema version.
  uint32 schema_version = 8;
  // Registered repositories.
  uint32 repository_count = 9;
  // Workspaces in WORKSPACE_STATE_ACTIVE.
  uint32 active_workspace_count = 10;
  // Each materialization backend and whether it can serve workspace roots
  // under the state directory; empty with `skip_backends`.
  repeated BackendProbe backends = 11;
}

// One materialization backend's probe.
message BackendProbe {
  // The backend.
  Backend backend = 1;
  // Whether it can serve workspace roots under the state directory.
  bool available = 2;
  // Why it is unavailable; empty when available.
  string reason = 3;
  // The filesystem probed, such as `apfs` or `ext4`.
  string filesystem = 4;
}
