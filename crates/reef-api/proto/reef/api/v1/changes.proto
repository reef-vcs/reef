// Changes and the log.
//
// `revision` is a jj revset expression that must resolve to exactly one
// commit: none is NOT_FOUND, several are INVALID_ARGUMENT (a divergent
// change id names two commits; use a commit id). `@` is the request's
// `workspace`'s working-copy commit and is invalid without one. Symbols
// resolve in jj's order: tags, local bookmarks, commit id prefixes in hex,
// change id prefixes in reverse hex, then change id prefixes in hex; jj's
// `change_id()` takes reverse hex only. Reef defines four aliases and reads
// no user configuration: `trunk()` is the commit of the repository's
// default start bookmark (the first of `main`, origin's HEAD, `master` and
// `trunk`, locally then on `origin`), or `root()` when there is none;
// `immutable_heads()` is `trunk() | tags()`; `immutable()` is
// `::(immutable_heads() | root())`; and `mutable()` is `~immutable()`.
// `at_operation` is an operation id or unique prefix of lowercase hex: the
// read answers from that operation's view; empty means the current head.
// A commit created after that operation, named by commit id, resolves as
// hidden (R2.12).
// Reads whose revision or revset involves `@` snapshot the workspace first
// unless `skip_snapshot`; a read `at_operation` never snapshots.
//
// Errors of every revision read: INVALID_ARGUMENT with reason
// WORKSPACE_REQUIRED (`@` without `workspace`), INVALID_REVSET (jj's parse
// error as the message), AMBIGUOUS_ID_PREFIX (metadata `prefix`),
// AMBIGUOUS_REVISION (several commits; metadata `revision`, `commit_ids`),
// INVALID_OPERATION_ID, AMBIGUOUS_OPERATION_ID (metadata `operation_id`) or
// INVALID_PAGE_TOKEN; NOT_FOUND with reason REVISION_NOT_FOUND (metadata
// `revision`), WORKING_COPY_NOT_FOUND (metadata `workspace_id`,
// `at_operation`) or OPERATION_NOT_FOUND (metadata `operation_id`); and a
// failed snapshot's own error, with reason SNAPSHOT_FAILED (metadata
// `workspace_id`).
syntax = "proto3";

package reef.api.v1;

import "google/protobuf/timestamp.proto";
import "reef/api/v1/lifecycle.proto";
import "reef/api/v1/operations.proto";
import "reef/api/v1/options.proto";

// The log, and reading and rewriting changes.
service ChangeService {
  // The log: changes in topological order, children first, branches kept
  // together as `jj log` prints them, with graph edges. A page stops before
  // its response passes 3 MiB, so it may hold fewer than `page_size`
  // entries.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = IDEMPOTENT;
  }
  // One change. Errors: also INVALID_ARGUMENT with reason
  // REVISION_REQUIRED for an empty `revision`.
  rpc GetChange(GetChangeRequest) returns (GetChangeResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = IDEMPOTENT;
  }
  // Sets one commit's description, rebasing its descendants onto the new
  // commit with their trees unchanged; bookmarks and working copies follow.
  // The author stays; the committer becomes the daemon's identity, now. A
  // description already equal (after the trailing newline is added) records
  // no operation: `operation` is unset and `change` is the current commit.
  // Never snapshots, as it changes no tree; workspaces on the commit or its
  // descendants are held still while it writes (ADR 0031). One commit of a
  // divergent change, named by commit id, may be described; the change
  // stays divergent.
  //
  // Errors: as for every revision read, and INVALID_ARGUMENT with reason
  // REVISION_REQUIRED (empty `revision`), INVALID_COMMIT_ID (an
  // `expected_commit_id` that is not a full commit id; metadata
  // `commit_id`) or INVALID_DESCRIPTION (a NUL); FAILED_PRECONDITION with
  // reason EXPECTED_COMMIT_MISMATCH (metadata `expected_commit_id`,
  // `commit_id`), IMMUTABLE_REVISION or HIDDEN_REVISION (metadata
  // `commit_id`), IDENTITY_UNSET or SIGNOFF_WITHOUT_DESCRIPTION (`signoff`
  // and `reset_author`, #258), or for a `workspace` that is not active.
  rpc DescribeChange(DescribeChangeRequest) returns (DescribeChangeResponse) {
    option (reef.api.v1.access) = ACCESS_WRITE;
  }
  // Abandons one commit: how a divergent change is resolved (R1.13).
  // Workspaces on the commit or its descendants are snapshotted first, in
  // operations of their own, and take the result afterwards (ADR 0031); a
  // workspace that stays on its change keeps edits made after its
  // snapshot, carried onto its new commit (ADR 0039).
  //
  // When the commit's change has another visible commit that does not
  // descend from it (the newest by committer time when there are several),
  // that commit takes its place: descendants are rebased onto it,
  // bookmarks move to it, working copies edit it, and the effects report
  // the abandoned commit HIDDEN. Otherwise, as `jj abandon`: descendants
  // are rebased onto its parents, local bookmarks on it are deleted
  // (remote ones stay), and working copies on it share one new empty
  // commit on its parents. `UndoOperation` brings it back.
  //
  // Errors: as for DescribeChange, less INVALID_DESCRIPTION, and
  // FAILED_PRECONDITION with reason SNAPSHOT_FAILED (metadata
  // `workspace_id`) when a workspace could not be snapshotted first
  // (nothing is written), or CHANGE_IN_REVIEW (metadata `change_id`,
  // `state`) for a change that is PROPOSED or QUEUED and not divergent
  // (R3.09): withdraw it first.
  rpc AbandonChange(AbandonChangeRequest) returns (AbandonChangeResponse) {
    option (reef.api.v1.access) = ACCESS_WRITE;
  }
  // Moves a change through its lifecycle (R3.09, ADR 0063;
  // `docs/proposals.md`): `to` PROPOSED from DRAFT, WITHDRAWN or DECLINED
  // (a new round), or from PROPOSED when its commit moved (the new commit is
  // recorded); WITHDRAWN, DECLINED or SUPERSEDED from PROPOSED or QUEUED.
  // QUEUED and LANDED are the landing service's (R3.13) and LANDED also the
  // daemon's, which records one when a recorded change reaches `trunk()`.
  // Every transition records the change's visible commit and is one
  // operation of kind TRANSITION. A transition to the state the change is
  // in, with the same commit and destination, records nothing: `operation`
  // is unset. When `revision` involves `@`, the workspace is snapshotted
  // first unless `skip_snapshot`, and the snapshot is `snapshot`.
  //
  // PROPOSED refuses an immutable, hidden, empty or conflicted change, and
  // one commit of a divergent change. A recorded change with no visible
  // commit can still be withdrawn, declined or superseded, named by its
  // change id. Through the remote listener (R2.08):
  // any write token proposes a DRAFT change; only the token that proposed
  // it proposes it again, withdraws or supersedes it; nobody declines until
  // a remote human can be verified (R3.43).
  //
  // Errors: as for every revision read, and INVALID_ARGUMENT with reason
  // REVISION_REQUIRED, INVALID_COMMIT_ID (metadata `commit_id`),
  // TRANSITION_TARGET_REQUIRED (no `to`, or one this daemon does not know),
  // TRANSITION_RESERVED (metadata `to`; QUEUED, LANDED or DRAFT),
  // INVALID_REASON (over 4 KiB, or a control character but newline and
  // tab), INVALID_DESTINATION (metadata `destination`; not a local bookmark,
  // or set for another state than PROPOSED) or SUPERSEDED_BY_REQUIRED
  // (empty for SUPERSEDED, or set for another state); FAILED_PRECONDITION
  // with reason EXPECTED_COMMIT_MISMATCH (metadata `expected_commit_id`,
  // `commit_id`), IMMUTABLE_REVISION or HIDDEN_REVISION (metadata
  // `commit_id`), TRANSITION_NOT_ALLOWED (metadata `change_id`, `state`,
  // `to`), EXPECTED_STATE_MISMATCH (metadata `expected_state`, `state`),
  // CHANGE_EMPTY, CHANGE_CONFLICTED or CHANGE_DIVERGENT (metadata
  // `change_id`), INVALID_SUPERSEDED_BY (metadata `superseded_by`; the
  // change itself, or not one visible commit), NO_DESTINATION (no
  // `trunk()` and no `destination`), SNAPSHOT_FAILED (metadata
  // `workspace_id`), or for a `workspace` that is not active; and
  // PERMISSION_DENIED with reason REMOTE_PROPOSAL_NOT_OWNED (metadata
  // `change_id`) or REMOTE_HUMAN_REQUIRED.
  rpc TransitionChange(TransitionChangeRequest) returns (TransitionChangeResponse) {
    option (reef.api.v1.access) = ACCESS_WRITE;
  }
  // Changes with a recorded lifecycle, newest update first (R3.09). Each
  // entry has the change at head, unset when it has no visible commit.
  //
  // Errors: INVALID_ARGUMENT with reason INVALID_CHANGE_ID (metadata
  // `change`) or INVALID_PAGE_TOKEN; NOT_FOUND with reason
  // REPOSITORY_NOT_FOUND (metadata `repo`).
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Recorded transitions, newest first (R3.09): the lifecycle's audit
  // trail, kept through GC.
  //
  // Errors: as for ListProposals.
  rpc ListTransitions(ListTransitionsRequest) returns (ListTransitionsResponse) {
    option (reef.api.v1.access) = ACCESS_READ;
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Who made a commit, and when.
message Signature {
  // The name.
  string name = 1;
  // The email address.
  string email = 2;
  // When.
  google.protobuf.Timestamp at = 3;
}

// One commit of a change.
message Change {
  // The change, in hex.
  string change_id = 1;
  // The commit, in hex.
  string commit_id = 2;
  // Its parent commits.
  repeated string parent_commit_ids = 3;
  // Its parents' changes, in the order of `parent_commit_ids`.
  repeated string parent_change_ids = 4;
  // The full description.
  string description = 5;
  // The author.
  Signature author = 6;
  // The committer.
  Signature committer = 7;
  // The tree, in hex; empty when the tree is conflicted.
  string tree_id = 8;
  // The commit changes nothing against its parents.
  bool empty = 9;
  // The tree has conflicts.
  bool conflict = 10;
  // The change has more than one visible commit.
  bool divergent = 11;
  // The commit is an ancestor of `immutable_heads()`.
  bool immutable = 12;
  // The commit is not visible at the operation read; it was named by
  // commit id.
  bool hidden = 13;
  // Bookmarks pointing at it: local as `name`, remote as `name@remote`.
  repeated string bookmarks = 14;
  // Tags pointing at it.
  repeated string tags = 15;
  // Reef workspaces whose working-copy commit it is.
  repeated string workspace_ids = 16;
  // Other jj workspaces whose working-copy commit it is, such as `default`.
  repeated string jj_workspaces = 17;
  // Its lifecycle (R3.09), as of the operation read: the latest transition
  // recorded by that operation's end.
  ChangeLifecycle lifecycle = 18;
}

// How a log entry reaches a parent.
enum GraphEdgeKind {
  // Not set.
  GRAPH_EDGE_KIND_UNSPECIFIED = 0;
  // A direct parent, itself in the log.
  GRAPH_EDGE_KIND_DIRECT = 1;
  // The parent is reached through commits the log leaves out.
  GRAPH_EDGE_KIND_INDIRECT = 2;
  // The parent is outside the revset entirely.
  GRAPH_EDGE_KIND_MISSING = 3;
}

// An edge from a log entry to one of its parents.
message GraphEdge {
  // The parent's commit.
  string commit_id = 1;
  // How it is reached.
  GraphEdgeKind kind = 2;
}

// One entry of the log.
message LogEntry {
  // The change.
  Change change = 1;
  // Its edges to its parents in the log.
  repeated GraphEdge edges = 2;
}

// A page of the log.
message ListChangesRequest {
  // The repository; may be empty when `workspace` is named.
  string repo = 1;
  // The workspace `@` refers to; empty for none.
  string workspace = 2;
  // A jj revset expression; empty for Reef's default log set,
  // `trunk() | working_copies() | mutable()`: every working copy, every
  // visible mutable commit (each mutable head and its ancestors back to
  // `trunk()`), and `trunk()` itself. A server that does not speak jj's
  // revset language may refuse a non-empty one with UNSUPPORTED.
  string revset = 3;
  // Read at this operation; empty for the head.
  string at_operation = 4;
  // Answer from the last recorded snapshot instead of snapshotting first.
  bool skip_snapshot = 5;
  // Entries per page: 0 means 100, more than 1,000 means 1,000, and a
  // negative value is INVALID_ARGUMENT. A page may hold fewer.
  int32 page_size = 6;
  // The previous page's `next_page_token`; empty for the first page. A
  // token sent with different fields is INVALID_ARGUMENT, reason
  // INVALID_PAGE_TOKEN.
  string page_token = 7;
}

// A page of the log.
message ListChangesResponse {
  // The entries, children first.
  repeated LogEntry entries = 1;
  // The token for the next page; empty on the last page. Later pages read
  // the same operation as the first.
  string next_page_token = 2;
  // The operation the log was read at.
  string at_operation = 3;
}

// One change.
message GetChangeRequest {
  // The repository; may be empty when `workspace` is named.
  string repo = 1;
  // The workspace `@` refers to; empty for none.
  string workspace = 2;
  // The revision.
  string revision = 3;
  // Read at this operation; empty for the head.
  string at_operation = 4;
  // Answer from the last recorded snapshot instead of snapshotting first.
  bool skip_snapshot = 5;
}

// One change.
message GetChangeResponse {
  // The change.
  Change change = 1;
  // The operation it was read at.
  string at_operation = 2;
}

// Set a change's description.
message DescribeChangeRequest {
  // The repository; may be empty when `workspace` is named.
  string repo = 1;
  // The workspace `@` refers to; empty for none.
  string workspace = 2;
  // The revision to describe.
  string revision = 3;
  // The new description, in full. A trailing newline is added when it is
  // not empty and lacks one, as jj stores descriptions.
  string description = 4;
  // When non-empty, FAILED_PRECONDITION unless the revision still resolves
  // to this commit.
  string expected_commit_id = 5;
  // Add a `Signed-off-by:` trailer for the daemon's identity, as
  // `git commit -s` does, unless the description already has it (#258).
  // With an empty `description`, the current description is kept and the
  // trailer added. FAILED_PRECONDITION with reason IDENTITY_UNSET while the
  // daemon's identity is the default, or SIGNOFF_WITHOUT_DESCRIPTION when
  // the description would be only the trailer.
  bool signoff = 6;
  // Set the commit's author and committer to the daemon's identity and the
  // current time, as `jj describe --reset-author` does (#258). With an
  // empty `description`, the current description is kept.
  // FAILED_PRECONDITION with reason IDENTITY_UNSET while the daemon's
  // identity is the default.
  bool reset_author = 7;
}

// What a describe recorded.
message DescribeChangeResponse {
  // The change afterwards.
  Change change = 1;
  // The operation that rewrote it.
  Operation operation = 2;
}

// Abandon a change.
message AbandonChangeRequest {
  // The repository; may be empty when `workspace` is named.
  string repo = 1;
  // The workspace `@` refers to; empty for none.
  string workspace = 2;
  // The revision to abandon.
  string revision = 3;
  // When non-empty, FAILED_PRECONDITION unless the revision still resolves
  // to this commit.
  string expected_commit_id = 4;
}

// What an abandon recorded.
message AbandonChangeResponse {
  // The commit abandoned.
  string abandoned_commit_id = 1;
  // The operation that abandoned it.
  Operation operation = 2;
}

// Move a change through its lifecycle.
message TransitionChangeRequest {
  // The repository; may be empty when `workspace` is named.
  string repo = 1;
  // The workspace `@` refers to, and whose provenance session is recorded;
  // empty for none.
  string workspace = 2;
  // The change, by a revision naming one of its commits; required.
  string revision = 3;
  // The state to move it to: PROPOSED, WITHDRAWN, DECLINED or SUPERSEDED.
  LifecycleState to = 4;
  // When set, FAILED_PRECONDITION unless the change is in this state.
  LifecycleState expected_state = 5;
  // When non-empty, FAILED_PRECONDITION unless the revision still resolves
  // to this commit.
  string expected_commit_id = 6;
  // Why, for the record; at most 4 KiB of UTF-8, no control characters but
  // newline and tab. Untrusted text to every reader.
  string reason = 7;
  // For SUPERSEDED, a revision naming one visible commit of the superseding
  // change; empty otherwise.
  string superseded_by = 8;
  // For PROPOSED, the local bookmark it is proposed for; empty for the one
  // `trunk()` resolves to.
  string destination = 9;
  // Who is performing it, recorded as declared; through the remote listener
  // always AGENT.
  TransitionActor actor = 10;
  // Do not snapshot the workspace first.
  bool skip_snapshot = 11;
}

// What a transition recorded.
message TransitionChangeResponse {
  // The change's lifecycle afterwards.
  ChangeLifecycle lifecycle = 1;
  // The transition recorded; unset when nothing changed.
  ChangeTransition transition = 2;
  // The operation that recorded it; unset when nothing changed.
  Operation operation = 3;
  // The workspace's snapshot taken first, if it recorded an operation.
  Operation snapshot = 4;
  // The change afterwards.
  Change change = 5;
}

// List recorded lifecycles.
message ListProposalsRequest {
  // The repository.
  string repo = 1;
  // States to list; empty for PROPOSED and QUEUED.
  repeated LifecycleState states = 2;
  // Change id prefixes, in hex or jj's reverse hex; empty for every change.
  repeated string changes = 3;
  // Agents that recorded the latest proposal; empty for any.
  repeated string agents = 4;
  // At most this many entries; 0 for the default (100), at most 1,000.
  int32 page_size = 5;
  // A previous response's `next_page_token`.
  string page_token = 6;
}

// One recorded change's lifecycle.
message ProposalEntry {
  // The change, in hex.
  string change_id = 1;
  // Its lifecycle now.
  ChangeLifecycle lifecycle = 2;
  // The change at head; unset when it has no visible commit.
  Change change = 3;
  // The agent that recorded its latest proposal; empty for none.
  string proposed_by = 4;
}

// A page of recorded lifecycles.
message ListProposalsResponse {
  // The entries.
  repeated ProposalEntry entries = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// List recorded transitions.
message ListTransitionsRequest {
  // The repository.
  string repo = 1;
  // Change id prefixes, in hex or jj's reverse hex; empty for every change.
  repeated string changes = 2;
  // Target states; empty for any.
  repeated LifecycleState to = 3;
  // Causes; empty for any.
  repeated TransitionCause causes = 4;
  // Only transitions recorded after this time.
  google.protobuf.Timestamp recorded_after = 5;
  // At most this many transitions; 0 for the default (100), at most 1,000.
  int32 page_size = 6;
  // A previous response's `next_page_token`.
  string page_token = 7;
}

// A page of transitions.
message ListTransitionsResponse {
  // The transitions, newest first.
  repeated ChangeTransition transitions = 1;
  // Empty on the last page.
  string next_page_token = 2;
}
