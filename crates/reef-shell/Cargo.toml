[package]
name = "reef-shell"
description = "Reef's desktop shell core (R3.39): its connection to the daemon, which needs-you-now items it notifies, its menu and its links, with no UI toolkit. Reef is version control for fleets of coding agents."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "desktop"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
bench = false

[dependencies]
reef-api.workspace = true
reef-client.workspace = true
tokio.workspace = true
tonic.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
reef-daemon = { workspace = true, features = ["testing"] }
reef-testing.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
