[package]
name = "reef-lib"
description = "Reef core library: data model, snapshots, workspaces, and merge. Reef is version control built for a world where AI agents write most of the code."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "jujutsu"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# The lib has no #[bench] functions. Without this, `cargo bench -p reef-lib -- <criterion args>`
# also hands the arguments to the lib's libtest harness, which rejects them.
[lib]
bench = false

[features]
# jj-lib's Watchman integration (R1.14, ADR 0023): narrowed snapshot scans, and the
# `watchman_client` crate re-exported for the daemon's trigger subscriptions. Off by default; the
# daemon turns it on.
watchman = ["jj-lib/watchman", "dep:watchman_client"]

[dependencies]
jj-lib.workspace = true
watchman_client = { workspace = true, optional = true }
gix.workspace = true
prost.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
serde.workspace = true
humantime-serde.workspace = true

[dev-dependencies]
reef-testing.workspace = true
tokio.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
criterion.workspace = true

[[bench]]
name = "snapshot"
harness = false
