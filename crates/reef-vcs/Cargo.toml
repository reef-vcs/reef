[package]
name = "reef-vcs"
description = "Reef: version control for fleets of coding agents. Provides the `reef` binary, a thin client of the daemon (`reef-daemon`), and re-exports the API and client crates."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "jujutsu"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# `cargo binstall reef-vcs` (R1.28): the release workflow's tarballs. binstall falls back from a
# Linux gnu target to musl, the only Linux build.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/reef-{ version }-{ target }.tar.gz"
bin-dir = "reef-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "reef"
path = "src/main.rs"

[dependencies]
# The thin client and the error conventions, and no other Reef crate: `reef` links neither the
# daemon nor jj-lib, which reef-testing's crate_graph test checks (R2.05, ADR 0033).
reef-client.workspace = true
reef-error.workspace = true
reef-api.workspace = true        # the reef.api.v1 messages the CLI builds and prints (R2.01)
prost-types.workspace = true     # google.protobuf.Duration in those messages
tracing.workspace = true
thiserror.workspace = true
clap.workspace = true
clap_complete.workspace = true
humantime.workspace = true
serde.workspace = true
serde_json.workspace = true      # `-o json`
tokio = { workspace = true, features = ["process"] }   # `ws run`'s child (R1.21)
nix = { workspace = true, features = ["signal"] }   # `reef daemon stop`, `ws run`'s forwarding
rmcp.workspace = true            # `reef mcp` (R2.13)
schemars.workspace = true        # its tools' input schemas
base64.workspace = true          # `edit_files`' `content_base64`
indexmap.workspace = true        # `.mcp.json` merged in its own order (R2.13)

[dev-dependencies]
prost-reflect.workspace = true   # the tools' annotations against the descriptor set (R2.13)
assert_cmd.workspace = true
jj-lib.workspace = true          # tests/ws_run.rs reads the final snapshot's tree
pollster.workspace = true
tonic.workspace = true           # statuses for the heartbeater's fake daemon
reef-daemon = { workspace = true, features = ["testing"] }
reef-lib.workspace = true        # tests open jj repositories; never a normal dependency (R2.05)
reef-testing.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-stream.workspace = true    # tests/old_daemon.rs serves its fake 0.1 daemon on a Unix socket
toml.workspace = true
nix = { workspace = true, features = ["signal"] }
