[package]
name = "reef-vcs"
description = "Reef: version control for fleets of coding agents. Provides the `reef` binary and re-exports the Reef library and daemon crates."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "jujutsu"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# `cargo binstall reef-vcs` (R1.28): the release workflow's tarballs. binstall falls back from a
# Linux gnu target to musl, the only Linux build.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/reef-{ version }-{ target }.tar.gz"
bin-dir = "reef-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "reef"
path = "src/main.rs"

[features]
default = ["watchman"]
# Forwarded to reef-daemon (R1.14). reef-daemon has it in its own defaults too, so turning it
# off takes `--no-default-features` on both.
watchman = ["reef-daemon/watchman"]

[dependencies]
# Only for `reef_lib::error` (ErrorKind, Classify, ErrorChain); never `reef_lib::jj`, which
# tests/cli.rs checks. R2.05 moves those types into the API crate and drops this dependency.
reef-lib.workspace = true
reef-daemon.workspace = true
reef-api.workspace = true        # the reef.api.v1 messages the CLI builds and prints (R2.01)
prost-types.workspace = true     # google.protobuf.Duration in those messages
tracing.workspace = true
thiserror.workspace = true
clap.workspace = true
clap_complete.workspace = true
humantime.workspace = true
serde.workspace = true
serde_json.workspace = true      # `-o json`
tokio = { workspace = true, features = ["process"] }   # `ws run`'s child (R1.21)
nix = { workspace = true, features = ["signal"] }   # `reef daemon stop`, `ws run`'s forwarding

[dev-dependencies]
assert_cmd.workspace = true
jj-lib.workspace = true          # tests/ws_run.rs reads the final snapshot's tree
pollster.workspace = true
tonic.workspace = true           # statuses for the heartbeater's fake daemon
reef-daemon = { workspace = true, features = ["testing"] }
reef-testing.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-stream.workspace = true    # tests/old_daemon.rs serves its fake 0.1 daemon on a Unix socket
toml.workspace = true
nix = { workspace = true, features = ["signal"] }
