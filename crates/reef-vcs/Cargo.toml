[package]
name = "reef-vcs"
description = "Reef: version control built for a world where AI agents write most of the code. Provides the `reef` binary and re-exports the Reef library and daemon crates."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "jujutsu"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "reef"
path = "src/main.rs"

[dependencies]
reef-lib.workspace = true
reef-daemon.workspace = true
tracing.workspace = true
anyhow.workspace = true          # the binary only
clap.workspace = true
serde_json.workspace = true      # `-o json`

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
