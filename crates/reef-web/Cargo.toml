[package]
name = "reef-web"
description = "Reef web UI assets: the built app the daemon serves on its loopback listener, or a placeholder when it was not built. Reef is version control for fleets of coding agents."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "web-ui"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# `assets` is built by `just web-build` and ignored by git (R2.18, ADR 0047); a package made
# after a build carries it, one made before carries the placeholder only.
include = ["src", "build.rs", "placeholder", "assets", "tests", "README.md"]

[lints]
workspace = true

[lib]
bench = false

# No dependencies: the daemon embeds this crate, and nothing else reaches it (crate_graph).
[dependencies]
