# The token-efficiency benchmark's scenario (R2.17): the fixture, the
# questions with their truth, and the scripted candidates. See
# docs/token-benchmark.md. Changing anything here (or a prompt, or the self
# patch) starts a new baseline: rows record this file's digest.

[fixture]
# Release 0.2.0 (#105), tagged v0.2.0. Its tree is the initial import.
base = "b5741e8f71728f9362f8ebe59ec2ebe8427e77cf"
# Agent and harness configuration, removed from the import and from every
# session's diff, so no arm starts with project instructions.
strip = ["AGENTS.md", "CLAUDE.md", ".claude", ".cursor", ".codex", ".mcp.json"]
# The agent whose checkout a trial runs in.
trial_agent = "bot-0"

# Landed on `main` in this order, one commit each, authored by the agent.
[[fixture.landed]]
agent = "bot-1"
commit = "a4fb5b5ab9e69b6eff26b2ae43332094c433bc9b" # CI: macOS job cap 40 to 50 minutes (#106)
[[fixture.landed]]
agent = "bot-2"
commit = "74ebfcb4c8413c3ee9ba4d1316376682043d5c8c" # R2.15: symbol-level diff (#110)
[[fixture.landed]]
agent = "bot-3"
commit = "b68578b741db5e64deecddaccc8698f57778cb8c" # burst_coalesces at the shipped watcher pacing (#112)

# Work in progress on `main` after the landed sessions, uncommitted in a git
# worktree or snapshotted in a Reef workspace.
[[fixture.open]]
agent = "bot-4"
commit = "f4e34d3d063cfb98163eea40ea3c6b56db62cf3b" # Fixed-width RFC 3339 timestamps (#111)
[[fixture.open]]
agent = "bot-5"
commit = "79ad454805b82700d264951754ee351cf264a03d" # R2.16: query layer (#113)
[[fixture.open]]
agent = "bot-0"
patch = "patches/self.patch" # one file modified, one added, one deleted

# The sentence each arm's prompt names its tool with. They differ only in
# the tool.
[arms]
git = "Answer with git."
reef = "Answer with the `reef` command."
mcp = "Answer with the reef tools."

# The diff sweep: this many commits of `main` up to the base, each diffed
# by git and by Reef's views.
[sweep]
commits = 20

# Placeholders in steps and call arguments: {wt:bot-4} is bot-4's worktree
# (git), {ws:bot-4} its workspace id and {change:bot-4} its change id
# (Reef). {wt:*}, {ws:*} and {change:*} repeat the step once per open
# session other than the trial agent's, in agent order. Pipes and loops are
# not allowed: an agent cannot filter output it has not seen.

[[question]]
id = "state-own"
kind = "files"
truth = "ANSWER: D .editorconfig; M crates/reef-testing/src/git.rs; A docs/fixture-notes.md | base: burst_coalesces at the shipped watcher pacing (#112)"

