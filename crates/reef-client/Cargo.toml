[package]
name = "reef-client"
description = "Reef client: the thin client of the Reef daemon's API, its stable JSON, and how to find the daemon. Reef is version control for fleets of coding agents."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "grpc"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
bench = false

# No reef-lib, no reef-daemon, no jj-lib: the `reef` binary is built on this crate, and
# `reef-testing`'s crate_graph test checks that its dependency closure stays that way (R2.05,
# ADR 0033).
[dependencies]
reef-api.workspace = true
reef-error.workspace = true
tonic.workspace = true
prost.workspace = true           # request sizes, checked before sending (R2.04)
prost-types.workspace = true     # google.protobuf.Timestamp and Duration in the messages
hyper-util.workspace = true      # the Unix socket connector
tower.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true      # the backup manifest
thiserror.workspace = true
nix = { workspace = true, features = ["hostname", "user"] }   # the default owner, `<user>@<host>`
etcetera.workspace = true        # the platform's default state directory
toml.workspace = true            # the client's three keys of config.toml
time.workspace = true            # RFC 3339 timestamps in the JSON
base64.workspace = true          # `file read -o json` of bytes that are not UTF-8 (R2.27)
blake3.workspace = true          # the content digest a SCIP upload names (R2.14)
tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true          # the remote listener's TLS (R2.08)
tokio-rustls.workspace = true
webpki.workspace = true          # a leaf's SubjectPublicKeyInfo, for fingerprints
ring.workspace = true            # SHA-256 of a pinned key
rustls-native-certs.workspace = true   # the OS's roots, for a CA-issued certificate

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true           # certificates for the pin verifier's tests (R2.08)
tokio = { workspace = true, features = ["test-util"] }   # paused clocks in the reporter's tests (R2.11)
