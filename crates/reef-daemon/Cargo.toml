[package]
name = "reef-daemon"
description = "Reef daemon: the local service that owns snapshots, workspaces, leases, and the typed API. Reef is version control for fleets of coding agents."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "jujutsu"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# `cargo binstall reef-daemon` (R2.05): the same tarballs as `reef-vcs`'s, which carry both
# binaries; `reef` runs this one. binstall falls back from a Linux gnu target to musl.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/reef-{ version }-{ target }.tar.gz"
bin-dir = "reef-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Neither has #[bench] functions. Without this, `cargo bench -p reef-daemon -- <criterion args>`
# also hands the arguments to their libtest harnesses, which reject them.
[lib]
bench = false

[[bin]]
name = "reef-daemon"
path = "src/main.rs"
bench = false

[features]
# Watchman as the snapshot trigger and scan narrowing for large repositories (R1.14, ADR 0023).
# On by default so released binaries have it; `watcher.backend = "watchman"` is unavailable
# without it.
default = ["watchman"]
watchman = ["reef-lib/watchman"]
# `reef_daemon::testing::TestDaemon` for this crate's integration tests and `reef-vcs`'s.
# reef-testing is `publish = false`, so publishing this crate first needs the feature's
# synthetic-repo helper moved out (or reef-testing published).
testing = ["dep:tempfile", "dep:reef-testing"]
# Tests that need root: the kernel overlayfs backend (R1.09), its own tests and the backend
# conformance suite (R1.11). CI's `overlayfs` job runs them under `sudo -E`. Enables tests only;
# no `cfg` outside a test reads it.
privileged-tests = []

[dependencies]
reef-lib.workspace = true
reef-api.workspace = true
reef-client.workspace = true     # the client, its JSON, and the path layering the CLI shares (R2.05)
reef-error.workspace = true
reef-broker.workspace = true     # the subscription broker (R2.22)
reef-symbols.workspace = true    # the symbol index's extraction (R2.14)
reef-web.workspace = true        # the web UI's embedded assets (R2.18)
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rusqlite.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true      # `watchman get-sockname` (R1.14)
time.workspace = true
anyhow.workspace = true          # main.rs and run_main only
walkdir.workspace = true
blake3.workspace = true          # store lockfile hashes (R1.20)
nix = { workspace = true, features = ["hostname", "user", "signal", "resource"] }   # the default identity and jj's operation.hostname/username; killing a store build's process group (R1.20); the open-file limit (R2.22)
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tonic-web.workspace = true       # the web UI's gRPC-web (R2.18)
http-body.workspace = true       # the web listener's response bodies (R2.18)
prost.workspace = true
prost-types.workspace = true     # google.protobuf.Timestamp in the API
base64.workspace = true          # page tokens (R2.01)
hyper-util.workspace = true
tower.workspace = true
clap.workspace = true
pollster.workspace = true
futures.workspace = true
etcetera.workspace = true
toml.workspace = true
humantime-serde.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
rayon.workspace = true
tempfile = { workspace = true, optional = true }
reef-testing = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true            # clonefile(2) on a directory (R1.08)
reflink-copy.workspace = true    # per-file clones (R1.08's fallback, R1.10)

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["mount", "fs"] }   # overlay mounts (R1.09), store bind mounts (R1.20)

[[test]]
name = "watchman"
required-features = ["watchman"]

# Workspace creation per backend and through the daemon (R1.12). See docs/benchmarks.md.
[[bench]]
name = "workspace_create"
harness = false

# The symbol index through the daemon (R2.14). See docs/benchmarks.md.
[[bench]]
name = "symbols"
harness = false

# The history index through the daemon (R2.16). See docs/benchmarks.md.
[[bench]]
name = "history"
harness = false
required-features = ["testing"]

[dev-dependencies]
# Without default features, so `--no-default-features` test builds really leave `watchman` off.
reef-daemon = { path = ".", version = "0.2.0", default-features = false, features = ["testing"] }
jj-lib.workspace = true          # tests/workspaces.rs sets a bookmark the way `jj bookmark set` does
serde_json.workspace = true
tempfile.workspace = true
reef-testing.workspace = true
gix = { workspace = true, features = ["excludes"] }   # tests/workspaces.rs asks git's own ignore stack about `.jj` (R1.25)
pollster.workspace = true
tokio = { workspace = true, features = ["test-util"] }   # paused clocks in subscription tests (R2.09)
sha2.workspace = true            # the conformance suite's tree digest (R1.11)
nix = { workspace = true, features = ["signal", "hostname", "resource"] }   # SIGTERM in the binary test; the hostname check; a spawned daemon's open-file limit (R2.22)
criterion.workspace = true
# The web listener's tests (R2.18): gRPC-web and plain HTTP/1.1 against it.
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
http-body-util.workspace = true
tonic-web.workspace = true
