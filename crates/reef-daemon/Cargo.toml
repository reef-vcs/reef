[package]
name = "reef-daemon"
description = "Reef daemon: the local service that owns snapshots, workspaces, leases, and the typed API. Reef is version control built for a world where AI agents write most of the code."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "jujutsu"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "reef-daemon"
path = "src/main.rs"

[features]
# `reef_daemon::testing::TestDaemon` for this crate's integration tests and `reef-vcs`'s.
# reef-testing is `publish = false`, so publishing this crate first needs the feature's
# synthetic-repo helper moved out (or reef-testing published).
testing = ["dep:tempfile", "dep:reef-testing"]

[dependencies]
reef-lib.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rusqlite.workspace = true
rand.workspace = true
serde.workspace = true
time.workspace = true
anyhow.workspace = true          # main.rs and run_main only
walkdir.workspace = true
nix = { workspace = true, features = ["hostname", "user"] }   # the default identity and jj's operation.hostname/username
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true     # google.protobuf.Timestamp in the API
hyper-util.workspace = true
tower.workspace = true
clap.workspace = true
pollster.workspace = true
futures.workspace = true
etcetera.workspace = true
toml.workspace = true
humantime-serde.workspace = true
tempfile = { workspace = true, optional = true }
reef-testing = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build.workspace = true
protox.workspace = true
prost-types.workspace = true

[dev-dependencies]
reef-daemon = { path = ".", version = "0.0.0", features = ["testing"] }
jj-lib.workspace = true          # tests/workspaces.rs sets a bookmark the way `jj bookmark set` does
serde_json.workspace = true
tempfile.workspace = true
reef-testing.workspace = true
pollster.workspace = true
tokio.workspace = true
nix = { workspace = true, features = ["signal", "hostname"] }   # SIGTERM in the binary test; the hostname check
