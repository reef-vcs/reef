[package]
name = "reef-daemon"
description = "Reef daemon: the local service that owns snapshots, workspaces, leases, and the typed API. Reef is version control built for a world where AI agents write most of the code."
readme = "README.md"
keywords = ["vcs", "version-control", "agents", "jujutsu"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "reef-daemon"
path = "src/main.rs"

[dependencies]
reef-lib.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
rand.workspace = true
serde.workspace = true
time.workspace = true
anyhow.workspace = true          # main.rs only
walkdir.workspace = true
nix.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
reef-testing.workspace = true
pollster.workspace = true
