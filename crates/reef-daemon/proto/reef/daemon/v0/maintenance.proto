// Maintenance of the daemon's repositories and state (R1.17). R1.18 adds
// Backup, Quiesce, and Resume to the same service.
syntax = "proto3";

package reef.daemon.v0;

import "google/protobuf/timestamp.proto";

service Maintenance {
  // Garbage collection: jj's operations and git objects older than the undo
  // window, base cache entries no active workspace uses, ended workspace
  // records, and unused stores. Refused with UNAVAILABLE while another
  // maintenance task (GC, backup, quiesce) runs.
  rpc Gc(GcRequest) returns (GcResponse);
}

message GcRequest {
  // A repo id, a unique id prefix, or an absolute path inside a registered
  // root; empty for every registered repository.
  string repo = 1;
  // Report what would be freed without deleting anything.
  bool dry_run = 2;
}

// What GC did to one repository. Byte counts are allocated blocks.
message GcReport {
  string repo_id = 1;
  // Nothing newer than this was deleted: now minus the undo window, or
  // minus the backup retention while the last backup is within it.
  google.protobuf.Timestamp keep_newer = 2;
  // The operation store and git objects before and after the jj step (the
  // same in a dry run).
  uint64 jj_bytes_before = 3;
  uint64 jj_bytes_after = 4;
  // Rebuilding jj's index from the surviving operations.
  uint64 reindex_ms = 5;
  // Why the jj step stopped short (such as `git` missing); empty if it did
  // not. The other steps still ran.
  string jj_error = 6;
  uint32 base_entries_removed = 7;
  uint64 base_bytes_freed = 8;
  uint32 workspace_rows_removed = 9;
  // The `wc/<id>` state directories of the removed rows.
  uint64 wc_bytes_freed = 10;
  uint32 stores_removed = 11;
  uint64 store_bytes_freed = 12;
  uint64 elapsed_ms = 13;
  bool dry_run = 14;
}

message GcResponse {
  // One per repository, in registration order.
  repeated GcReport reports = 1;
}
