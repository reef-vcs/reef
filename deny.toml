[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
# The list covers the dependency tree Phase 0 builds up (jj-lib, tokio, criterion, ...), which
# R0.04 to R0.06 add. Until then most entries are unused; do not warn about that.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# reef-testing is an unpublished path dependency with no version; that is not a wildcard risk.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
