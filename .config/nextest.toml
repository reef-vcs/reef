# cargo-nextest configuration (https://nexte.st/docs/configuration/).
#
# Tests that print a measurement show their output even when they pass, so
# the numbers appear in CI logs on both runners (R1.05: create time with the
# base cached, the first snapshot against a cold scan, the colocated ref
# import).
[[profile.default.overrides]]
filter = "package(reef-daemon) & binary(workspaces) & (test(register_then_create_default) | test(first_snapshot_is_noop) | test(colocated_repo_imports_refs))"
success-output = "immediate"

# The Watchman tests (R1.14) share the machine's one Watchman server, and
# `survives_watchman_restart` shuts it down, so they run one at a time.
# The `heavy` tests run one at a time, so the timing-bound tests beside them
# keep their CPU and disk. The GC tests (R1.17) each run `git gc`, which
# packs on every core. R1.26's stdin test runs every command, `ws gc` among
# them. The backup tests (R1.18) run GC too, and five writers against a
# backup. The disk-full tests (R1.23) fill a 256 MB volume; on the 3-vCPU
# `macos-15` runner, two of them beside a backup test starved
# `integration`'s crash tests (main, 2026-10-23).
[test-groups]
watchman = { max-threads = 1 }
heavy = { max-threads = 1 }

# Shown when they pass too, so a run without `watchman` (macOS CI) says
# `skipped: watchman not on PATH` instead of passing silently.
[[profile.default.overrides]]
filter = "package(reef-daemon) & binary(watchman)"
test-group = "watchman"
success-output = "immediate"

[[profile.default.overrides]]
filter = "(package(reef-daemon) & (binary(gc) | binary(backup) | binary(disk_full))) | (package(reef-lib) & binary(jj_gc)) | (package(reef-vcs) & binary(cli) & test(every_command_completes_with_stdin_closed))"
test-group = "heavy"

# The backend conformance suite (R1.11) prints each kind's timing row and
# every `skipped: <kind or case>: <reason>`, so they show when it passes.
[[profile.default.overrides]]
filter = "package(reef-daemon) & binary(backend_conformance)"
success-output = "immediate"
