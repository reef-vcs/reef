version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The Python SDK's lock file (R2.06). A grpcio-tools bump raises the runtime floors in
  # pyproject.toml too; test_floors_match_the_generator fails until it does.
  - package-ecosystem: uv
    directory: /sdk/python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  # The TypeScript SDK's lock file (R2.07). A protoc-gen-es or Connect bump raises the runtime
  # floors in package.json too; codegen.test.ts's floors tests fail until it does.
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    groups:
      typescript:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]
    ignore:
      # jj-lib is bumped deliberately, see ADR 0002 and ADR 0008. This also silences Dependabot
      # security PRs for it; `just deny-advisories` in CI is the signal for jj-lib advisories.
      - dependency-name: jj-lib
      # Pinned to exactly the gix jj-lib depends on (Cargo.toml), so it moves with jj-lib; as
      # for jj-lib, `cargo deny` in CI reports its advisories.
      - dependency-name: gix
