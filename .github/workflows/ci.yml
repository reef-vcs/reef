name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes stop; every commit on main keeps its result and saves its cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_WARNINGS: deny
  RUSTDOCFLAGS: -D warnings
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - run: just fmt-check

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - run: just deny
      - run: just deny-advisories
        continue-on-error: true

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      # The Watchman tests (R1.14) run on Linux only; on macOS they report
      # themselves skipped (`brew install watchman` is too slow for every run).
      - name: Install watchman
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y watchman
          watchman version
      - name: Lint
        run: just lint
      - name: Build
        run: just build
      # The daemon builds without Watchman too, and its unit tests (and
      # reef-lib's) pass that way.
      - name: Check without default features
        run: |
          cargo check -p reef-daemon --no-default-features
          cargo test -p reef-daemon -p reef-lib --no-default-features --lib
      - name: Test
        run: just test
      - name: Docs
        run: just doc
      # The synthetic repo generator must write byte-identical trees on every platform (R0.05).
      - name: Synth digest
        run: just synth-digest | tee "digest-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: synth-digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.txt
          retention-days: 7

  # The overlay backends (R1.09, ADR 0016): fuse-overlayfs unprivileged, then
  # kernel overlayfs as root. The root step runs last, and target/ goes back to
  # the runner user after it, or the cache save fails on root-owned files.
  overlayfs:
    name: overlayfs (ubuntu-24.04, privileged)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      # btrfs-progs and xfsprogs are for R1.10's reflink tests.
      - run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs btrfs-progs xfsprogs
      - name: Build the privileged tests
        run: cargo nextest run -p reef-daemon --features privileged-tests --no-run
      # Unfiltered: with fuse-overlayfs installed, `auto` picks it, so every
      # daemon test also runs on overlay workspaces.
      - name: Daemon tests on fuse-overlayfs (unprivileged)
        run: cargo nextest run -p reef-daemon --features privileged-tests
      # `overlay`, not `overlayfs`: the backend's own tests are in `backend::overlay`. The
      # `stores` binary as root gets read-only bind mounts (R1.20).
      - name: Kernel overlayfs, reflink conformance, and store bind mounts (root)
        run: sudo -E env "PATH=$PATH" cargo nextest run -p reef-daemon --features privileged-tests -E 'test(/overlay|reflink/) | binary(stores)'
      - name: Give target/ back to the runner user
        if: always()
        run: sudo chown -R "$(id -un)" target

  # Every platform's digest must equal the pinned one, so an output change that is the same on
  # both platforms still fails until GENERATOR_VERSION is bumped and the pin updated.
  synth-determinism:
    name: synth determinism
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: crates/reef-testing/synth-small-seed1.sha256
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: synth-digest-*
          merge-multiple: true
      - run: |
          head digest-*.txt crates/reef-testing/synth-small-seed1.sha256
          [[ "$(ls digest-*.txt | wc -l)" -eq 2 ]]
          [[ "$(cat digest-*.txt crates/reef-testing/synth-small-seed1.sha256 | sort -u | wc -l)" -eq 1 ]]

  ci-ok:
    name: CI passed
    # always(), not !cancelled(): a skipped required check counts as passing on GitHub, so this
    # job must run and fail when anything it needs was cancelled.
    if: always()
    needs: [fmt, deny, check, overlayfs, synth-determinism]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Results go through env rather than being spliced into the script, so the JSON's quotes
      # cannot break the shell.
      - env:
          NEEDS: ${{ toJSON(needs) }}
          FMT: ${{ needs.fmt.result }}
          DENY: ${{ needs.deny.result }}
          CHECK: ${{ needs.check.result }}
          OVERLAYFS: ${{ needs.overlayfs.result }}
          SYNTH: ${{ needs.synth-determinism.result }}
        run: |
          echo "$NEEDS"
          [[ "$FMT" == "success" && "$DENY" == "success" && "$CHECK" == "success" && "$OVERLAYFS" == "success" && "$SYNTH" == "success" ]]
