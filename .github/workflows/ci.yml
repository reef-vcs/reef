name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so that adding the `macos` label runs the macOS legs while the self-hosted Mac is
    # off (see `plan`). Any label restarts the run, so labels go on when a pull request is
    # opened. There is no `unlabeled`: removing `macos` takes effect at the next push, and a
    # re-run keeps its event's labels.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes stop; every commit on main keeps its result and saves its cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # As setup-rust-toolchain sets it, for the self-hosted Mac, which does not run that action.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_BUILD_WARNINGS: deny
  RUSTDOCFLAGS: -D warnings
  RUST_BACKTRACE: 1
  # Rust caches are saved by main's runs only; a pull request restores main's. The repository's
  # 10 GB of cache had filled with each pull request's own (400 to 900 MB a job), evicting main's,
  # so every pull request built cold; and a run cancelled mid-build (see `cancel`) would save a
  # half-built cache that its pull request's later runs restore as an exact hit and never replace.
  RUST_CACHE_SAVE: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read

jobs:
  # Where the macOS legs (`check`, `python`, `typescript`) run, if at all. With the repository
  # variable MACOS_RUNNER set to `self-hosted`, they run on every push to main, manual run and pull
  # request, on the maintainer's Mac (scripts/mac-runner.sh): warm, and with no wait for GitHub's
  # macOS capacity. The repository is public, so a pull request from a fork, or from Dependabot
  # (whose build scripts are new upstream code), goes to GitHub's macos-15 instead, which runs on
  # pushes to main, manual runs and pull requests labelled `macos`. Unset MACOS_RUNNER when the Mac
  # is away, or its jobs wait for it: `gh variable delete MACOS_RUNNER`.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
      os: ${{ steps.plan.outputs.os }}
      macos_runner: ${{ steps.plan.outputs.macos_runner }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MACOS_RUNNER: ${{ vars.MACOS_RUNNER }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'macos') }}
        run: |
          if [[ "$MACOS_RUNNER" == self-hosted && "$SAME_REPO" == true && "$AUTHOR" != 'dependabot[bot]' ]]; then
            macos=true
            runner='["self-hosted", "macOS", "ARM64", "reef-mac"]'
          else
            macos=$([[ "$EVENT" != pull_request || "$LABELLED" == true ]] && echo true || echo false)
            runner='"macos-15"'
          fi
          os=$([[ "$macos" == true ]] && echo '["ubuntu-24.04", "macos-15"]' || echo '["ubuntu-24.04"]')
          echo "macOS legs: $macos, on $runner"
          {
            echo "macos=$macos"
            echo "os=$os"
            echo "macos_runner=$runner"
          } >>"$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - run: just fmt-check
      - run: just doc-links

  # The API schema (R2.01, ADR 0029): lint, formatting, and, on a pull request, no breaking change
  # against the base. The breaking check needs v1 on the base, which R2.01's own PR does not have.
  api:
    name: API schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: "1.74.0"
      - run: buf lint
      - run: buf format --diff --exit-code
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [[ -z "$(git ls-tree -d "origin/$BASE" crates/reef-api/proto/reef/api/v1)" ]]; then
            echo "origin/$BASE has no reef.api.v1 yet; nothing to compare"
            exit 0
          fi
          buf breaking --against ".git#ref=origin/$BASE"

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ env.RUST_CACHE_SAVE }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - run: just deny
      - run: just deny-advisories
        continue-on-error: true

  # Clippy on Linux, its own job so that a lint failure ends a pull request's run in minutes (see
  # `cancel`) and `check` starts its build up to two minutes sooner. macOS lints in `check`, where it
  # runs, rather than taking a second macOS runner.
  lint:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ env.RUST_CACHE_SAVE }}
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - run: just lint
      # rustdoc with warnings denied, as the check jobs' Docs step: here it fails the quick gate
      # in a couple of minutes instead of 13 or more into a check job.
      - run: just doc

  # On the self-hosted Mac (see `plan`), checkout keeps target/ (mac-runner-hook.sh removes every
  # other untracked file before the job), and rustup installs the toolchain in place of
  # setup-rust-toolchain, whose macOS step needs Homebrew's bash and whose Rust cache would only
  # restore main's build over a target/ that is already warm. The same goes for `python` and
  # `typescript`. Its macOS is the Mac's, not 15's; release.yml builds the binaries on macos-15.
  check:
    name: ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.macos_runner) || matrix.os }}
    # macos-15 took 24 to 29 minutes on main by #96; the `heavy` group runs
    # one test at a time (about 10 minutes there), and #95's GC timer tests
    # added about 2 more. By #104 the tests take 22 to 24 minutes, and a build
    # that misses the cache (a lockfile or version change) about 8 more, so a
    # cold run is about 40 minutes.
    #
    # On GitHub's runner, macOS runs on main after every merge, on a manual run, and on a pull
    # request labelled `macos`, not on every pull request: its 25 to 45 minutes and GitHub's
    # macOS arm64 capacity (on 2026-11-02 one job went unassigned twice, cancelled after 15
    # minutes each time) held up every merge. release.yml runs only once a tag is pushed and
    # smoke-tests the binaries, so a tag waits for main's latest run, macOS included, to be
    # green (CONTRIBUTING.md).
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-save-if: ${{ env.RUST_CACHE_SAVE }}
      - name: Rust toolchain (self-hosted)
        if: runner.environment == 'self-hosted'
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      # The Watchman tests (R1.14) run on Linux only; on macOS they report
      # themselves skipped (`brew install watchman` is too slow for every run).
      - name: Install watchman
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y watchman
          watchman version
      # The reference executor's sandbox on Linux (R3.06): bubblewrap needs unprivileged user
      # namespaces, which Ubuntu 24.04 restricts through AppArmor unless the image lifts it. The
      # step says which it found; the tests then fail rather than run checks unsandboxed.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y bubblewrap
          bwrap --version
          if bwrap --unshare-user --unshare-net --ro-bind / / true; then
            echo "bubblewrap creates user namespaces as is"
          else
            echo "::notice::user namespaces are restricted on this image; lifting the AppArmor restriction for this VM"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            bwrap --unshare-user --unshare-net --ro-bind / / true
          fi
          echo "REEF_EXECUTOR_TESTS_REQUIRE_SANDBOX=1" >>"$GITHUB_ENV"
      # Linux lints in the `lint` job.
      - name: Lint
        if: runner.os == 'macOS'
        run: just lint
      - name: Build
        run: just build
      # The committed agent files are what `reef init` writes (R1.27).
      - name: Agent files
        run: just agent-files
      # install.sh against a tarball of the build above (R1.28). shellcheck is on the Ubuntu
      # image only; the lint is the same on both.
      - name: Installer lint
        if: runner.os == 'Linux'
        run: just installer-lint
      - name: Installer
        run: scripts/test-install.sh --build-dir target/debug
      # Phase 2's exit criterion for remote access (R2.08): a daemon in one container reached
      # from another, over TLS with a token, through the CLI and curl.
      - name: Remote listener across containers
        if: runner.os == 'Linux'
        run: scripts/test-remote.sh target/debug/reef target/debug/reef-daemon
      # The daemon builds without Watchman too, and its unit tests (and
      # reef-lib's) pass that way.
      - name: Check without default features
        run: |
          cargo check -p reef-daemon --no-default-features
          cargo test -p reef-daemon -p reef-lib --no-default-features --lib
      # A self-hosted runner keeps target/, so a shape file from an earlier run must not pass for
      # this one's.
      - name: Test
        run: |
          rm -f target/cli-shape-*.json
          just test
      - name: Docs
        run: just doc
      # The synthetic repo generator must write byte-identical trees on every platform (R0.05).
      - name: Synth digest
        run: just synth-digest | tee "digest-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: synth-digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.txt
          retention-days: 7
      # The key sets of the CLI's JSON from R1.23's scripted session, compared across platforms
      # by the cli-shape job.
      - uses: actions/upload-artifact@v7
        with:
          name: cli-shape-${{ matrix.os }}
          path: target/cli-shape-*.json
          if-no-files-found: error
          retention-days: 7

  # The reference executor's Seatbelt sandbox (R3.06). The self-hosted Mac runs every job inside
  # its own Seatbelt profile (scripts/mac-runner.sh), and macOS refuses a sandbox inside another,
  # so there the executor's tests run their checks unsandboxed and say so. This job runs them on
  # GitHub's macOS with the sandbox required, on main and on pull requests labelled `macos`, as the
  # macOS legs did before #211.
  executor-sandbox-macos:
    name: executor sandbox (macos-15, hosted)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')
    runs-on: macos-15
    timeout-minutes: 40
    env:
      REEF_EXECUTOR_TESTS_REQUIRE_SANDBOX: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ env.RUST_CACHE_SAVE }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      - name: The executor's tests, sandboxed
        run: cargo nextest run -p reef-executor
      - name: The CLI's executor tests and probes
        run: cargo nextest run -p reef-vcs -E 'test(/executor/)'

  # The overlay backends (R1.09, ADR 0016): fuse-overlayfs unprivileged, then
  # kernel overlayfs as root. The root step runs last, and target/ goes back to
  # the runner user after it, or the cache save fails on root-owned files. 45 minutes: main's
  # runs took 18-29 min by R2.23, the fuse-overlayfs step alone ~19 min.
  overlayfs:
    name: overlayfs (ubuntu-24.04, privileged)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ env.RUST_CACHE_SAVE }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      # btrfs-progs and xfsprogs make the reflink tests' filesystems (R1.10).
      - run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs btrfs-progs xfsprogs
      # `reef` too: R1.23's integration tests run it, and `-p reef-daemon` does not build it.
      - name: Build the privileged tests
        run: |
          cargo nextest run -p reef-daemon --features privileged-tests --no-run
          cargo build -p reef-vcs --bin reef
      # Unfiltered: with fuse-overlayfs installed, `auto` picks it, so every
      # daemon test also runs on overlay workspaces.
      - name: Daemon tests on fuse-overlayfs (unprivileged)
        run: cargo nextest run -p reef-daemon --features privileged-tests
      # The runner's disk is ext4, which cannot reflink, so the reflink backend (R1.10) runs on
      # loop-mounted btrfs and XFS images. Mounting needs root; the tests do not. Both run even
      # if the first fails.
      - name: Reflink backend on btrfs and XFS
        run: |
          failed=""
          for fs in btrfs xfs; do
            image="$RUNNER_TEMP/reef-$fs.img"
            truncate -s 2G "$image"
            case "$fs" in
              btrfs) sudo mkfs.btrfs -q "$image" ;;
              xfs) sudo mkfs.xfs -q -m reflink=1 "$image" ;;
            esac
            sudo mkdir -p "/mnt/reef-$fs"
            sudo mount -o loop "$image" "/mnt/reef-$fs"
            sudo chown "$(id -un)" "/mnt/reef-$fs"
            echo "::group::reflink on $fs"
            REEF_TEST_REFLINK_DIR="/mnt/reef-$fs" cargo nextest run -p reef-daemon --features privileged-tests --no-capture -E 'test(/reflink/)' || failed="$failed $fs"
            echo "::endgroup::"
            sudo umount "/mnt/reef-$fs"
          done
          if [[ -n "$failed" ]]; then echo "::error::reflink tests failed on:$failed"; exit 1; fi
      # `overlay`, not `overlayfs`: the backend's own tests are in `backend::overlay`. The
      # `stores` binary as root gets read-only bind mounts (R1.20). R1.23: a killed daemon's
      # kernel overlay and bind mounts across a restart, and the full disk on a tmpfs. RX.01: the
      # ownership tests, which chown to uid 1, the root daemon's warning, and hostile repository
      # content on kernel overlay workspaces. R1.32: background watch attaches on kernel overlay
      # workspaces. R2.02: a status read that snapshots a kernel overlay workspace first. R2.03: an
      # abandon whose follow-up checks the new tree out into an overlay's upper layer.
      - name: Kernel overlayfs and store bind mounts (root)
        run: sudo -E env "PATH=$PATH" cargo nextest run -p reef-daemon --features privileged-tests -E 'test(/overlay/) | binary(stores) | binary(disk_full) | (binary(integration) & test(/restart|store_shared/)) | test(/another_user|owned_root|sudo_user|root_daemon/) | binary(hostile_repo) | test(/before_the_watch_attaches|during_a_pending_attach|attach_inline/) | (binary(reads) & test(/status_snapshots_first/)) | (binary(writes) & test(/abandon_change/)) | (binary(files) & test(/edit_files_moves_workspaces/)) | test(/carries|late_overlap/)'
      - name: Give target/ back to the runner user
        if: always()
        run: sudo chown -R "$(id -un)" target

  # The web UI (R2.18, ADR 0047): lint, typecheck, Vitest and the build, then reef-web's tests
  # against the real assets. The TypeScript is generated from the protos at every build, so a
  # schema change that breaks the app fails here. The daemon's web tests run in `check`, against
  # the placeholder, through the same serving code. The app in real browsers is `web-e2e`.
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ env.RUST_CACHE_SAVE }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - name: Install
        working-directory: web
        run: npm ci
      - name: Check
        run: just web-check
      # Reported, not failing, as `deny-advisories` is.
      - name: npm audit
        working-directory: web
        run: npm audit --omit=dev
        continue-on-error: true

  # The web UI in real browsers (#128): reef and reef-daemon built with the app, a scratch daemon,
  # and Playwright in Chromium, Firefox and WebKit. Its own job so `web` stays fast; off the
  # critical path (the macOS check job is). Browsers are downloaded, not cached, as Playwright
  # advises: their system packages are installed on every run anyway.
  web-e2e:
    name: web e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ env.RUST_CACHE_SAVE }}
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - name: Install
        working-directory: web
        run: npm ci
      - name: Browsers
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - name: Smoke test
        run: just web-e2e
      # Traces hold the session token of a daemon that stopped before the upload, on a runner
      # that is gone after the job.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: web-e2e
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The Python SDK (R2.06, ADR 0054): generated from the protos at every build, then ruff, mypy
  # --strict and the unit tests, then the integration tests against reef-daemon built from the same
  # commit, on the floor and the newest Python. Ubuntu on every pull request; macOS where `check`
  # runs it (the default state directory's space is in real paths there). One leg also builds the
  # sdist and wheel and smoke-tests the wheel alone, as the release does before publishing.
  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.macos_runner) || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-save-if: ${{ env.RUST_CACHE_SAVE }}
      - name: Rust toolchain (self-hosted)
        if: runner.environment == 'self-hosted'
        run: rustup toolchain install && rustc --version
      - uses: astral-sh/setup-uv@v10.3.3   # no moving v10 tag
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - name: Sync
        working-directory: sdk/python
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Check
        run: just python-check
      - name: Build the daemon
        run: cargo build -p reef-vcs -p reef-daemon
      - name: Integration tests
        run: just python-test
      - name: Build and smoke-test the wheel
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: |
          just python-build
          uv venv --python 3.11 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" sdk/python/dist/*.whl
          cd "$RUNNER_TEMP" && REEF_BIN_DIR="$GITHUB_WORKSPACE/target/debug" "$RUNNER_TEMP/wheel/bin/python" "$GITHUB_WORKSPACE/sdk/python/tests/smoke.py"

  # The TypeScript SDK (R2.07, ADR 0054): generated from the protos, linted, typechecked and
  # unit-tested, then run against scratch daemons built from this commit, on the oldest Node it
  # supports and the newest LTS. One leg packs the tarball and smoke-tests it alone.
  typescript:
    name: typescript ${{ matrix.node }} (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os == 'macos-15' && fromJSON(needs.plan.outputs.macos_runner) || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        node: ["22.15.0", "26"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-save-if: ${{ env.RUST_CACHE_SAVE }}
      - name: Rust toolchain (self-hosted)
        if: runner.environment == 'self-hosted'
        run: rustup toolchain install && rustc --version
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - name: Install
        working-directory: sdk/typescript
        run: npm ci
      - name: Check
        run: just typescript-check
      - name: Build the daemon
        run: cargo build -p reef-vcs -p reef-daemon
      - name: Integration tests
        run: just typescript-test
      - name: Pack and smoke-test the tarball
        if: runner.os == 'Linux' && matrix.node == '22.15.0'
        run: |
          just typescript-build
          dir="$RUNNER_TEMP/npm-smoke"
          mkdir "$dir"
          cp sdk/typescript/tests/smoke.mjs "$dir/"
          cd "$dir"
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund "$GITHUB_WORKSPACE"/sdk/typescript/dist-pack/reef-vcs-*.tgz
          REEF_BIN_DIR="$GITHUB_WORKSPACE/target/debug" node smoke.mjs
          node -e 'if (typeof require("reef-vcs").connect !== "function") process.exit(1)'
      - name: Audit
        if: runner.os == 'Linux' && matrix.node == '22.15.0'
        working-directory: sdk/typescript
        continue-on-error: true
        run: npm audit --omit=dev

  # Every platform's digest must equal the pinned one, so an output change that is the same on
  # both platforms still fails until GENERATOR_VERSION is bumped and the pin updated.
  synth-determinism:
    name: synth determinism
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MACOS: ${{ needs.plan.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: crates/reef-testing/synth-small-seed1.sha256
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: synth-digest-*
          merge-multiple: true
      - run: |
          head digest-*.txt crates/reef-testing/synth-small-seed1.sha256
          [[ "$(ls digest-*.txt | wc -l)" -eq "$([[ "$MACOS" == true ]] && echo 2 || echo 1)" ]]
          [[ "$(cat digest-*.txt crates/reef-testing/synth-small-seed1.sha256 | sort -u | wc -l)" -eq 1 ]]

  # The CLI's JSON has the same keys on both platforms (R1.23, test 12).
  cli-shape:
    name: CLI shape
    needs: [plan, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MACOS: ${{ needs.plan.outputs.macos }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-shape-*
          merge-multiple: true
      - run: |
          ls cli-shape-*.json
          if [[ "$MACOS" != true ]]; then
            echo "macOS did not run on this pull request; nothing to compare"
            [[ "$(ls cli-shape-*.json | wc -l)" -eq 1 && -f cli-shape-linux.json ]]
            exit 0
          fi
          [[ "$(ls cli-shape-*.json | wc -l)" -eq 2 ]]
          diff cli-shape-linux.json cli-shape-macos.json

  # A pull request whose quick gates fail stops there instead of running the 30-to-40-minute jobs to
  # the end: the fix is another push, which would cancel this run anyway. It fires once all four
  # gates have finished, clippy last, a few minutes in. Test failures do not
  # cancel, so a run shows every one of them. Pushes to main keep every job's result and cache.
  # `CI passed` still runs on a cancelled run (always()) and fails. This job checks nothing out and
  # runs no code from the pull request, so it alone holds `actions: write`. A pull request from a
  # fork gets a read-only token whatever the job asks for, so there it warns and the run goes on.
  cancel:
    name: cancel after a failed gate
    needs: [fmt, api, deny, lint]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "a quick gate (rustfmt, API schema, cargo deny, or clippy and rustdoc) failed; cancelling the rest of the run"
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || echo "::warning::could not cancel run $GITHUB_RUN_ID"

  ci-ok:
    name: CI passed
    # always(), not !cancelled(): a skipped required check counts as passing on GitHub, so this
    # job must run and fail when anything it needs was cancelled.
    if: always()
    needs: [plan, fmt, api, deny, lint, check, overlayfs, synth-determinism, cli-shape, web, web-e2e, python, typescript, executor-sandbox-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Results go through env rather than being spliced into the script, so the JSON's quotes
      # cannot break the shell.
      - env:
          NEEDS: ${{ toJSON(needs) }}
          PLAN: ${{ needs.plan.result }}
          FMT: ${{ needs.fmt.result }}
          API: ${{ needs.api.result }}
          DENY: ${{ needs.deny.result }}
          LINT: ${{ needs.lint.result }}
          CHECK: ${{ needs.check.result }}
          OVERLAYFS: ${{ needs.overlayfs.result }}
          SYNTH: ${{ needs.synth-determinism.result }}
          CLI_SHAPE: ${{ needs.cli-shape.result }}
          WEB: ${{ needs.web.result }}
          WEB_E2E: ${{ needs.web-e2e.result }}
          PYTHON: ${{ needs.python.result }}
          TYPESCRIPT: ${{ needs.typescript.result }}
          # Skipped on a pull request without the `macos` label.
          EXECUTOR_MAC: ${{ needs.executor-sandbox-macos.result }}
        run: |
          echo "$NEEDS"
          [[ "$PLAN" == "success" && "$FMT" == "success" &&"$API" == "success" && "$DENY" == "success" && "$LINT" == "success" && "$CHECK" == "success" && "$OVERLAYFS" == "success" && "$SYNTH" == "success" && "$CLI_SHAPE" == "success" && "$WEB" == "success" && "$WEB_E2E" == "success" && "$PYTHON" == "success" && "$TYPESCRIPT" == "success" ]]
          [[ "$EXECUTOR_MAC" == "success" || "$EXECUTOR_MAC" == "skipped" ]]
