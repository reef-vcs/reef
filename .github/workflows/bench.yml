name: Benchmarks

# Trend data only, not a gate: results are uploaded as artifacts and nothing compares them yet
# (RX.06). PRs do not run the benches; ci.yml compiles them through `just build`.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC: large preset
  workflow_dispatch:
    inputs:
      preset:
        description: Synthetic repo preset
        default: medium
        type: choice
        options: [small, medium, large]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: bench ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The workspace benchmarks (R1.12) take about 17 minutes on medium and 53 on large on an
    # M2 Max, Linux runs them twice, and the runners are slower.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      REEF_BENCH_PRESET: ${{ github.event_name == 'schedule' && 'large' || inputs.preset || 'medium' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # ci.yml already compiles the benches with warnings denied; a lint must not fail this run.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      # The unprivileged overlay backend, so the workspace benchmarks (R1.12) cover it.
      - name: Install fuse-overlayfs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse-overlayfs
      # `--bench '*'` keeps criterion's arguments away from the libtest harnesses of lib and bin
      # targets. `shell: bash` adds pipefail, so a failed run is not hidden by tee.
      - name: Run benchmarks
        shell: bash
        run: cargo bench --workspace --bench '*' -- --output-format bencher | tee bench-results.txt
      # Kernel overlayfs needs root: REEF_BENCH_PRIVILEGED=1 benchmarks that backend alone, and
      # `create_api` on it, since `auto` picks it as root. Appends to target/bench-ws.json.
      - name: Run workspace benchmarks as root (kernel overlayfs)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo -E env "PATH=$PATH" REEF_BENCH_PRIVILEGED=1 \
            cargo bench -p reef-daemon --bench workspace_create -- --output-format bencher \
            | tee bench-results-privileged.txt
      # Before the upload and the cache save, which fail on root-owned files.
      - name: Give target/ back to the runner user
        if: ${{ always() && runner.os == 'Linux' }}
        run: sudo chown -R "$(id -un)" target
      - name: Fixture summary
        run: cat target/bench-fixtures/*/.reef-synth.json | jq -c '{files,dirs,bytes}' || true
      # Also after a failed run: partial results and reports help explain the failure.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          # The run id keeps a push run and a manual run of the same commit and preset apart.
          name: bench-${{ matrix.os }}-${{ env.REEF_BENCH_PRESET }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            bench-results.txt
            bench-results-privileged.txt
            target/bench-ws.json
            target/criterion/
          retention-days: 90
      # Keep the fixtures (up to a few GB for large) out of the toolchain action's target cache,
      # and the appended-to bench-ws.json, so the next run starts a new one.
      - name: Drop fixtures before the cache is saved
        if: always()
        run: rm -rf target/bench-fixtures target/bench-state target/criterion target/bench-ws.json
