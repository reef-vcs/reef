name: Release

# Prebuilt binaries (R1.28). A `v<version>` tag matching Cargo.toml's workspace version builds the
# four targets, tests the tarballs through install.sh, Homebrew, and cargo-binstall, publishes a
# GitHub Release with the tarballs, SHA256SUMS, install.sh, and CHANGELOG.md's section, and pushes
# the formula to the Homebrew tap. A dry run, `workflow_dispatch` with `dry_run` or a pull
# request that touches the release machinery, does everything but publish, and the tarballs stay
# on the run as artifacts. Unsigned until R4.17; the publish job attests the tarballs' build
# provenance (RX.01, S-06), which `gh attestation verify` checks. The web UI (R2.18) is built once,
# by the `web` job, and every target embeds the same bytes. Since R2.25 (ADR 0052) each target also
# gets an MCPB bundle, the release carries `reef schema`'s document and descriptor set, the harness
# packages are installed into each harness from the checkout, and a tag lists the bundles on the
# MCP registry. The plugins themselves are released by the tag: their marketplaces, in this
# repository, pin it. Since R2.06 (ADR 0054) the Python SDK is built and smoke-tested on every run,
# and a tag publishes it to PyPI by trusted publishing; since R2.07 the TypeScript SDK is packed and
# smoke-tested the same way, and a tag publishes it to npm by trusted publishing, with provenance.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - install.sh
      - packaging/**
      - plugins/**
      - .claude-plugin/**
      - .agents/plugins/**
      - scripts/**
      - crates/reef-vcs/build.rs
      - crates/reef-web/build.rs
      - crates/reef-web/placeholder/**
      - sdk/python/pyproject.toml
      - sdk/python/hatch_build.py
      - sdk/python/codegen/**
      - sdk/python/tests/smoke.py
      - sdk/fixtures/page-items.json
      - sdk/typescript/package.json
      - sdk/typescript/package-lock.json
      - sdk/typescript/buf.gen*.yaml
      - sdk/typescript/codegen/**
      - sdk/typescript/scripts/**
      - sdk/typescript/tests/smoke.mjs
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only; keep the tarballs on the run, not a Release
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # The harnesses the packages are tested in, and the packaging tools (R2.25). A bump is a pull
  # request, whose dry run tests it.
  CLAUDE_CODE_VERSION: 2.1.316
  CODEX_VERSION: 0.166.0
  OPENCODE_VERSION: 1.19.5
  MCPB_VERSION: 2.1.2
  MCP_PUBLISHER_VERSION: v1.8.7

permissions:
  contents: read

jobs:
  check-version:
    name: check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Inputs go through env rather than being spliced into the script.
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          version="$(scripts/version.sh)"
          publish=false
          if [[ "$EVENT" == push || ( "$EVENT" == workflow_dispatch && "$DRY_RUN" == false ) ]]; then
            publish=true
            if [[ "$REF" != "refs/tags/v$version" ]]; then
              echo "::error::publishing reef $version needs the tag v$version, Cargo.toml's workspace version; this run is for $REF"
              exit 1
            fi
          fi
          # Fail now, not after the builds, if the release would have no
          # notes; a dry run checks them too.
          scripts/release-notes.sh "$version" >/dev/null
          # The packages name this version and pin its tag (R2.25): a release
          # pull request that bumped the version without `just packages`
          # fails here.
          for file in plugins/claude-code/.claude-plugin/plugin.json \
            plugins/claude-code-workspaces/.claude-plugin/plugin.json plugins/agent-plugins/plugin.json \
            packaging/mcpb/manifest.json packaging/mcp/server.json; do
            if [[ "$(jq -r .version "$file")" != "$version" ]]; then
              echo "::error file=$file::$file is not for reef $version; run just packages"
              exit 1
            fi
          done
          for file in .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            # Every entry: the marketplace lists more than one plugin (R2.26).
            refs="$(jq -r '.plugins[] | .source.ref? // "missing"' "$file")"
            if grep -qvxF "v$version" <<<"$refs"; then
              echo "::error file=$file::$file does not pin v$version; run just packages"
              exit 1
            fi
          done
          echo "reef $version, publish: $publish"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"

  # The web UI's assets (R2.18, ADR 0047), built once for all four targets so they cannot differ.
  # A release builds without the npm and Rust caches; dry runs use them.
  web:
    name: web
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: ${{ needs.check-version.outputs.publish != 'true' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: ${{ needs.check-version.outputs.publish != 'true' }}
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Test
        run: REEF_WEB_EXPECT_BUILT=1 cargo test -p reef-web --locked
      - uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: crates/reef-web/assets
          if-no-files-found: error
          retention-days: 14

  # Every target builds on a native runner, so each binary runs its own smoke test.
  build:
    name: build ${{ matrix.target }}
    needs: [check-version, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A release builds from scratch; dry runs reuse a cache.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache: ${{ needs.check-version.outputs.publish != 'true' }}
          cache-key: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The `web` job's assets, where reef-web's build script embeds them.
      - uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: crates/reef-web/assets
      - name: Build
        run: |
          if [[ "$TARGET" == *-linux-musl ]]; then
            # Bundled SQLite and BLAKE3 compile C, which must target musl too.
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          cargo build --profile dist --locked --target "$TARGET" -p reef-vcs -p reef-daemon
      - name: Smoke test
        run: |
          bin="target/$TARGET/dist"
          ls -l "$bin/reef" "$bin/reef-daemon"
          "$bin/reef" --version | tee version.txt
          grep -Eqx "reef ${VERSION//./\\.} \([0-9a-f]{12}, $TARGET\)" version.txt
          "$bin/reef-daemon" --version
          "$bin/reef" guide >guide.txt
          head -1 guide.txt
          # The daemon embeds the `web` job's app, not the placeholder (R2.18): the hashed script
          # its index.html names is in the binary, and the placeholder page's sentence is not.
          script="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' crates/reef-web/assets/index.html | head -1)"
          [[ -n "$script" ]]
          grep -aqF "$script" "$bin/reef-daemon"
          # `if`, not `!`: bash -e ignores a negated command's failure.
          if grep -aqF "Released binaries include it" "$bin/reef-daemon"; then
            echo "::error::reef-daemon for $TARGET embeds the placeholder page, not the web UI"
            exit 1
          fi
          if [[ "$TARGET" == *-linux-musl ]]; then
            # Static (`file` says "statically linked" on arm64, "static-pie linked" on x86_64), so it
            # runs where there is no glibc at all.
            file "$bin/reef" "$bin/reef-daemon" | tee file.txt
            [[ "$(grep -Ec 'static(ally|-pie) linked' file.txt)" -eq 2 ]]
            docker run --rm -v "$PWD/$bin:/reef:ro" alpine:3.22 /reef/reef --version
          fi
      - name: Package
        run: scripts/package.sh "target/$TARGET/dist" "$VERSION" "$TARGET" dist
      # The MCPB bundle (R2.25), run as a client runs it on this target's own runner.
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      - name: MCPB bundle
        run: |
          bundle="$(scripts/package-mcpb.sh "target/$TARGET/dist" "$VERSION" "$TARGET" dist)"
          ls -l "$bundle"
          scripts/test-mcpb.sh "$bundle" "$VERSION" "$TARGET"
      # `reef schema`'s document and descriptor set (R2.24), once: they are the same on every target
      # but for the document's `reef.target`.
      - name: Schema
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          "target/$TARGET/dist/reef" schema >"dist/reef-$VERSION-schema.json"
          "target/$TARGET/dist/reef" schema --descriptor-set >"dist/reef-$VERSION-api.binpb"
          jq -e '.cli and .mcp and .api' "dist/reef-$VERSION-schema.json" >/dev/null
          [[ -s "dist/reef-$VERSION-api.binpb" ]]
      - uses: actions/upload-artifact@v7
        with:
          name: reef-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.mcpb
            dist/*-schema.json
            dist/*-api.binpb
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: reef-*
          merge-multiple: true
          path: dist
      - run: |
          cd dist
          [[ "$(ls ./*.tar.gz | wc -l)" -eq 4 ]]
          [[ "$(ls ./*.mcpb | wc -l)" -eq 4 ]]
          [[ "$(ls ./*-schema.json ./*-api.binpb | wc -l)" -eq 2 ]]
          sha256sum ./*.tar.gz ./*.mcpb ./*-schema.json ./*-api.binpb | sed 's| \./| |' >SHA256SUMS
          [[ "$(wc -l <SHA256SUMS)" -eq 10 ]]
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # install.sh, unattended, against this run's tarballs: on every target's runner, and under
  # busybox in Alpine, the smallest container an agent is likely to start in.
  install:
    name: install.sh on ${{ matrix.os }}
    needs: checksums
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The tarballs and SHA256SUMS only: `web-assets` is not shipped.
      - uses: actions/download-artifact@v8
        with:
          pattern: reef-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      - run: scripts/test-install.sh --dist dist
      # A released daemon serves the real app (R2.18): install it, open a session with the
      # installed `reef ui --print`, fetch `/`, and find the `web` job's hashed script in it.
      - uses: actions/download-artifact@v8
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: web-assets
          path: web-assets
      - name: Web UI
        if: matrix.os == 'ubuntu-24.04'
        run: |
          home="$RUNNER_TEMP/web-home" state="$RUNNER_TEMP/web-state"
          env HOME="$home" PATH=/usr/bin:/bin REEF_INSTALL_URL="file://$PWD/dist" sh install.sh </dev/null
          reef="$home/.local/bin/reef"
          script="$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' web-assets/index.html | head -1)"
          [[ -n "$script" ]]
          url="$("$reef" --state-dir "$state" ui --print -o json | jq -r .url)"
          echo "$url"
          curl -fsS "$url" | tee index.html
          grep -qF "$script" index.html
          "$reef" --state-dir "$state" daemon stop
      # The released binaries serve the API and the real app to another network host over TLS
      # with a token (R2.08): a daemon and a client in two containers.
      - name: Remote listener
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p "$RUNNER_TEMP/remote-bin"
          tar -xzf dist/reef-*-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP/remote-bin" --strip-components 1
          scripts/test-remote.sh "$RUNNER_TEMP/remote-bin/reef" "$RUNNER_TEMP/remote-bin/reef-daemon" --real-app
      - name: Alpine
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/src:ro" -w /src alpine:3.22 sh -c 'apk add -q --no-cache bash curl && scripts/test-install.sh --dist dist'

  # The tap's formula, rendered against this run's tarballs and installed from a scratch tap:
  # Homebrew refuses a formula file outside a tap.
  homebrew-test:
    name: brew install
    needs: [check-version, checksums]
    runs-on: macos-15
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The tarballs and SHA256SUMS only: `web-assets` is not shipped.
      - uses: actions/download-artifact@v8
        with:
          pattern: reef-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      - run: |
          scripts/update-tap.sh "$VERSION" dist/SHA256SUMS --base-url "file://$PWD/dist" --out reef.rb
          brew tap-new --no-git reef-vcs/scratch
          cp reef.rb "$(brew --repository)/Library/Taps/reef-vcs/homebrew-scratch/Formula/reef.rb"
          brew install --formula reef-vcs/scratch/reef
          brew test reef-vcs/scratch/reef
          "$(brew --prefix)/bin/reef" --version
          test -f "$(brew --prefix)/share/zsh/site-functions/_reef"

  # `cargo binstall reef-vcs reef-daemon` resolves the URL this workflow publishes to for both
  # crates, and the tarball has each binary where the metadata's bin-dir says. Before the release
  # exists the download itself 404s.
  binstall:
    name: cargo binstall
    needs: [check-version, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The tarballs only: `web-assets` is not shipped.
      - uses: actions/download-artifact@v8
        with:
          pattern: reef-*
          merge-multiple: true
          path: dist
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - run: |
          name="reef-$VERSION-x86_64-unknown-linux-musl"
          for pair in reef-vcs:reef reef-daemon:reef-daemon; do
            crate=${pair%%:*} bin=${pair#*:}
            cargo binstall --manifest-path "crates/$crate" --dry-run --no-confirm --no-track \
              --disable-strategies quick-install,compile --log-level debug "$crate" >binstall.log 2>&1 || true
            if ! grep -qF "https://github.com/reef-vcs/reef/releases/download/v$VERSION/$name.tar.gz" binstall.log; then
              cat binstall.log
              echo "::error::cargo binstall $crate did not resolve $name.tar.gz"
              exit 1
            fi
            tar -tzf "dist/$name.tar.gz" | grep -qx "$name/$bin"
          done

  # The packages installed into each harness as its quickstart line installs them, from this
  # checkout, against the released `reef` (R2.25, scripts/test-harness-packages.sh), and the
  # registry listing built from this run's checksums and checked by the registry's validator,
  # which publishes nothing. No harness is signed in.
  harness-packages:
    name: harness packages
    needs: [check-version, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: reef-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      - uses: sigstore/cosign-installer@v4.1.2   # no moving v4 tag
      - name: Install reef
        run: |
          env HOME="$RUNNER_TEMP/reef-home" PATH=/usr/bin:/bin REEF_INSTALL_URL="file://$PWD/dist" sh install.sh </dev/null
          echo "REEF_BIN=$RUNNER_TEMP/reef-home/.local/bin" >>"$GITHUB_ENV"
      - name: Harnesses
        run: scripts/test-harness-packages.sh "$REEF_BIN"
      - name: Registry listing
        run: |
          scripts/mcp-server-json.sh "$VERSION" dist/SHA256SUMS >server.json
          cat server.json
          publisher="$(scripts/mcp-publisher.sh "$RUNNER_TEMP/publisher")"
          "$publisher" validate server.json

  # The Python SDK (R2.06, ADR 0054): the sdist and the wheel built from it, at the workspace
  # version, checked by twine and smoke-tested alone (no checkout on the path) against this run's
  # Linux daemon on the floor and the newest Python. Every run, dry runs included; `release` waits
  # for it, and `pypi` publishes what it built.
  python-sdk:
    name: Python SDK
    needs: [check-version, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3   # no moving v10 tag
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Build
        working-directory: sdk/python
        run: |
          uv build --out-dir dist
          pep440="$(uv run --no-project --with packaging==26.3 python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "$VERSION")"
          ls -l dist
          [[ -f "dist/reef_vcs-$pep440-py3-none-any.whl" && -f "dist/reef_vcs-$pep440.tar.gz" ]]
          [[ "$(ls dist | wc -l)" -eq 2 ]]
          uvx twine==7.0.0 check --strict dist/*
      - uses: actions/download-artifact@v8
        with:
          name: reef-x86_64-unknown-linux-musl
          path: tarball
      - name: Smoke test
        run: |
          mkdir "$RUNNER_TEMP/reef"
          tar -xzf tarball/reef-"$VERSION"-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP/reef"
          bin="$(dirname "$(find "$RUNNER_TEMP/reef" -name reef-daemon -type f | head -1)")"
          for python in 3.11 3.15; do
            uv venv --python "$python" "$RUNNER_TEMP/py$python"
            uv pip install --python "$RUNNER_TEMP/py$python/bin/python" sdk/python/dist/*.whl
            (cd "$RUNNER_TEMP" && REEF_BIN_DIR="$bin" "$RUNNER_TEMP/py$python/bin/python" "$GITHUB_WORKSPACE/sdk/python/tests/smoke.py")
          done
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: sdk/python/dist/*
          if-no-files-found: error
          retention-days: 14

  # The TypeScript SDK (R2.07, ADR 0054): the tarball at the workspace version, checked by publint,
  # are-the-types-wrong and `scripts/npm-publish.sh --dry-run` (the `npm` job's command line,
  # publishing nothing), and smoke-tested alone (installed in a fresh directory) against this run's Linux
  # daemon on the floor and the newest LTS. Every run, dry runs included; `release` waits for it,
  # and `npm` publishes what it packed.
  typescript-sdk:
    name: TypeScript SDK
    needs: [check-version, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: ${{ needs.check-version.outputs.publish != 'true' && 'npm' || '' }}
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - name: Build
        run: |
          (cd sdk/typescript && npm ci)
          just typescript-build
          ls -l sdk/typescript/dist-pack
          [[ -f "sdk/typescript/dist-pack/reef-vcs-$VERSION.tgz" ]]
          [[ "$(ls sdk/typescript/dist-pack | wc -l)" -eq 1 ]]
          scripts/npm-publish.sh "sdk/typescript/dist-pack/reef-vcs-$VERSION.tgz" --dry-run
      - uses: actions/download-artifact@v8
        with:
          name: reef-x86_64-unknown-linux-musl
          path: tarball
      - name: Unpack the daemon
        run: |
          mkdir "$RUNNER_TEMP/reef"
          tar -xzf tarball/reef-"$VERSION"-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP/reef"
          echo "REEF_BIN_DIR=$(dirname "$(find "$RUNNER_TEMP/reef" -name reef-daemon -type f | head -1)")" >>"$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15.0"
      - name: Smoke test on Node 22.15
        run: scripts/npm-smoke.sh "$GITHUB_WORKSPACE/sdk/typescript/dist-pack/reef-vcs-$VERSION.tgz" "$RUNNER_TEMP/smoke22"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Smoke test on Node 26
        run: scripts/npm-smoke.sh "$GITHUB_WORKSPACE/sdk/typescript/dist-pack/reef-vcs-$VERSION.tgz" "$RUNNER_TEMP/smoke26"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: sdk/typescript/dist-pack/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish
    needs: [check-version, checksums, install, homebrew-test, binstall, harness-packages, python-sdk, typescript-sdk]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance (RX.01, S-06): the OIDC token the attestation is signed with, and the
      # repository's attestation store. This job only: dry runs attest nothing.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The tarballs and SHA256SUMS only: `web-assets` is not shipped.
      - uses: actions/download-artifact@v8
        with:
          pattern: reef-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      # Before the release exists, so a release never goes out without its attestation.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.mcpb
            dist/*-schema.json
            dist/*-api.binpb
            dist/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$VERSION" >notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Reef $VERSION" --notes-file notes.md \
            dist/*.tar.gz dist/*.mcpb dist/*-schema.json dist/*-api.binpb dist/SHA256SUMS install.sh

  # Pushes the formula `homebrew-test` installed to the tap's main, with the tap's deploy key (write
  # access to that repository only). A failure here does not fail the release: the formula can be
  # updated by hand with `scripts/update-tap.sh <version> SHA256SUMS`.
  homebrew:
    name: homebrew tap
    needs: [check-version, release]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
      - env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          advice="update it by hand: scripts/update-tap.sh $VERSION SHA256SUMS (SHA256SUMS from the release)"
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "::warning::no HOMEBREW_TAP_DEPLOY_KEY secret, so the tap was not updated; $advice"
            exit 0
          fi
          key="$RUNNER_TEMP/tap-key" hosts="$RUNNER_TEMP/known_hosts"
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" >"$key")
          # GitHub's host keys over HTTPS, rather than trusting the first SSH connection.
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >"$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts -o StrictHostKeyChecking=yes"
          if ! scripts/update-tap.sh "$VERSION" SHA256SUMS; then
            echo "::warning::pushing to the tap failed; $advice"
          fi
          rm -f "$key"

  # Lists the release's MCPB bundles on the MCP registry as io.github.reef-vcs/reef (R2.25), signed
  # in by this workflow's OIDC token, which the registry trusts for the io.github.reef-vcs
  # namespace. A published version cannot be changed. A failure here does not fail the release: the
  # listing can be published by hand, by an owner of the organization (the device login cannot
  # publish to an organization's namespace).
  mcp-registry:
    name: MCP registry
    needs: [check-version, release]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
      - uses: sigstore/cosign-installer@v4.1.2   # no moving v4 tag
      - run: |
          advice="publish it by hand: scripts/mcp-server-json.sh $VERSION SHA256SUMS >server.json, then mcp-publisher login github --token <an organization owner's token with read:org> and mcp-publisher publish"
          if ! scripts/mcp-server-json.sh "$VERSION" SHA256SUMS >server.json; then
            echo "::warning::server.json could not be written, so the listing was not published; $advice"
            exit 0
          fi
          # The release's assets answer before the registry is told about them.
          for url in $(jq -r '.packages[].identifier' server.json); do
            if ! curl -fsSLI -o /dev/null "$url"; then
              echo "::warning::$url does not answer, so the listing was not published; $advice"
              exit 0
            fi
          done
          if ! publisher="$(scripts/mcp-publisher.sh "$RUNNER_TEMP/publisher")" ||
            ! "$publisher" login github-oidc ||
            ! "$publisher" publish server.json; then
            echo "::warning::publishing to the MCP registry failed; $advice"
          fi

  # reef-vcs on PyPI (R2.06), by trusted publishing: the run's OIDC token is exchanged for a
  # short-lived upload token, so no secret is stored. PyPI's publisher names this repository, this
  # workflow and the `pypi` environment (the brief's one-time setup). After `release`: a version on
  # PyPI can never be uploaded again, so it goes out once the binaries it talks to exist. Warns
  # rather than fails, as the tap and the listing do: the release is already out.
  pypi:
    name: PyPI
    needs: [check-version, release]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/reef-vcs/
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - id: publish
        uses: pypa/gh-action-pypi-publish@v1.14.3   # by its full tag, as cosign-installer is
        continue-on-error: true
        with:
          packages-dir: dist/
      - if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning::publishing reef-vcs $VERSION to PyPI failed; check the trusted publisher (project reef-vcs, repository $GITHUB_REPOSITORY, workflow release.yml, environment pypi), then re-run this job: the run keeps python-dist for 14 days. By hand: download python-dist and run uvx twine upload dist/* with an API token for reef-vcs."

  # reef-vcs on npm (R2.07), by trusted publishing: the npm CLI exchanges the run's OIDC token for a
  # short-lived publish token and attaches a provenance attestation, so no secret is stored. npm's
  # trusted publisher names this repository, this workflow and the `npm` environment (the brief's
  # one-time setup). After `release`: a version on npm can never be published again, even after an
  # unpublish, so it goes out once the binaries it talks to exist. Warns rather than fails, as PyPI,
  # the tap and the listing do: the release is already out.
  npm:
    name: npm
    needs: [check-version, release]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/reef-vcs
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            web/.node-version
            scripts/npm-publish.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-dist
          path: dist
      - name: Check npm
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      - id: publish
        continue-on-error: true
        run: scripts/npm-publish.sh "dist/reef-vcs-$VERSION.tgz"
      - if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning::publishing reef-vcs $VERSION to npm failed; check the trusted publisher on npmjs.com (package reef-vcs, owner reef-vcs, repository reef, workflow release.yml, environment npm, allowed action npm publish; a new configuration expires 2 days after it is made unless a publish uses it), then re-run this job: the run keeps npm-dist for 14 days. By hand: download npm-dist and run npm publish ./reef-vcs-$VERSION.tgz --access public --tag latest --provenance=false (--tag next for a prerelease) signed in with 2FA."

  # The documented install lines, run as written now that the tag exists, and the listing as the
  # registry serves it. Warns, as the tap and the listing do: the release is already out.
  harness-packages-live:
    name: harness packages (released)
    needs: [check-version, release, mcp-registry]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
      - run: |
          warn() { echo "::warning::$*"; }
          home="$RUNNER_TEMP/live"
          mkdir -p "$home/.codex"
          if ! npm install --prefix "$RUNNER_TEMP/npm" --no-fund --no-audit --silent \
            "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" "@openai/codex@$CODEX_VERSION"; then
            warn "the harnesses could not be installed, so the released install lines were not run"
            exit 0
          fi
          bin="$RUNNER_TEMP/npm/node_modules/.bin"
          export HOME="$home" CLAUDE_CONFIG_DIR="$home/.claude" CODEX_HOME="$home/.codex"
          "$bin/claude" plugin install reef --marketplace reef-vcs/reef || warn "the Claude Code install line failed"
          "$bin/claude" plugin list --json | jq -e --arg v "$VERSION" '.[] | select(.id == "reef@reef" and .version == $v)' >/dev/null ||
            warn "Claude Code did not install reef $VERSION"
          { "$bin/codex" plugin marketplace add reef-vcs/reef && "$bin/codex" plugin add reef@reef; } || warn "the Codex install line failed"
          "$bin/codex" plugin list --json | jq -e --arg v "$VERSION" '.installed[] | select(.pluginId == "reef@reef" and .version == $v)' >/dev/null ||
            warn "Codex did not install reef $VERSION"
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.reef-vcs/reef" |
            jq -e --arg v "$VERSION" '[.servers[] | (.server // .) | select(.name == "io.github.reef-vcs/reef" and .version == $v)] | length > 0' >/dev/null ||
            warn "the registry does not list io.github.reef-vcs/reef $VERSION"
